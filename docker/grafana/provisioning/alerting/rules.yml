# Alert rules over signals only ClickHouse holds: per-domain errors, floods, and client-network share.
# They carry the same labels as Prometheus alerts and go to the same Alertmanager.
apiVersion: 1
groups:
- orgId: 1
  name: clickhouse-signals
  folder: Alert rules
  interval: 1m
  rules:
  - uid: cdnf-domain-5xx
    title: DomainFiveHundredRatioHigh
    condition: C
    for: 3m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        editorType: sql
        format: 0
        queryType: timeSeries
        rawSql: SELECT now() AS time, toString(domain_id) AS domain_id, pop, 100 * sumIf(requests, status >= 500) / sum(requests) AS value FROM cdnf.edge_traffic_1m WHERE interval_start > now() - INTERVAL 5 MINUTE GROUP BY domain_id, pop HAVING sum(requests)
          >= 100
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 900
        to: 0
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 900
        to: 0
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 20
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
    labels:
      team: noc
      severity: warning
      dashboard: cdnf-domain-overview
    annotations:
      summary: More than 20 percent of one domain's responses at one PoP are 5xx
      runbook_url: https://vaheed.github.io/CDNFoundry/operations/runbooks#domain-5xx-ratio-high
      dashboard_url: /d/cdnf-domain-overview
  - uid: cdnf-domain-flood
    title: DomainRequestFlood
    condition: C
    for: 3m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        editorType: sql
        format: 0
        queryType: timeSeries
        rawSql: SELECT now() AS time, toString(cur.domain_id) AS domain_id, cur.pop AS pop, (cur.requests / 300) / nullIf(base.requests / 86400, 0) AS value FROM (SELECT domain_id, pop, sum(requests) AS requests FROM cdnf.edge_traffic_1m WHERE interval_start
          > now() - INTERVAL 5 MINUTE GROUP BY domain_id, pop) AS cur INNER JOIN (SELECT domain_id, sum(requests) AS requests FROM cdnf.edge_traffic_hourly WHERE interval_start BETWEEN now() - INTERVAL 25 HOUR AND now() - INTERVAL 1 HOUR GROUP BY domain_id
          HAVING requests > 0) AS base USING domain_id WHERE cur.requests >= 1500
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 900
        to: 0
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 900
        to: 0
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
    labels:
      team: soc
      severity: critical
      dashboard: cdnf-l7-flood
    annotations:
      summary: One domain receives over ten times its usual request rate at one PoP
      runbook_url: https://vaheed.github.io/CDNFoundry/operations/runbooks#domain-request-flood
      dashboard_url: /d/cdnf-l7-flood
  - uid: cdnf-domain-network-share
    title: DomainSingleNetworkShare
    condition: C
    for: 3m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        editorType: sql
        format: 0
        queryType: timeSeries
        rawSql: SELECT now() AS time, toString(domain_id) AS domain_id, pop, 100 * max(per_asn) / sum(per_asn) AS value FROM (SELECT domain_id, pop, asn, count() AS per_asn FROM cdnf.edge_events WHERE occurred_at > now() - INTERVAL 10 MINUTE AND event_type
          = 'request' AND asn != 0 GROUP BY domain_id, pop, asn) GROUP BY domain_id, pop HAVING sum(per_asn) >= 2000
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 900
        to: 0
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 900
        to: 0
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 60
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
    labels:
      team: soc
      severity: warning
      dashboard: cdnf-l7-flood
    annotations:
      summary: One client network sends over 60 percent of a domain's requests at one PoP
      runbook_url: https://vaheed.github.io/CDNFoundry/operations/runbooks#domain-single-network-share
      dashboard_url: /d/cdnf-l7-flood
  - uid: cdnf-origin-failover
    title: OriginFailover
    condition: C
    for: 3m
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: clickhouse
      model:
        datasource:
          type: grafana-clickhouse-datasource
          uid: clickhouse
        editorType: sql
        format: 0
        queryType: timeSeries
        rawSql: SELECT now() AS time, toString(domain_id) AS domain_id, pop, count() AS value FROM cdnf.edge_events WHERE occurred_at > now() - INTERVAL 5 MINUTE AND origin_transition != 'none' GROUP BY domain_id, pop
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
    labels:
      team: noc
      severity: warning
      dashboard: cdnf-origin-health
    annotations:
      summary: A domain's traffic moved to its backup origin
      runbook_url: https://vaheed.github.io/CDNFoundry/operations/runbooks#origin-failover
      dashboard_url: /d/cdnf-origin-health
