apiVersion: 1

# One provider per audience folder. The folder UID is fixed so permissions can refer to it.
providers:
  - name: "00 Overview"
    orgId: 1
    folder: "00 Overview"
    folderUid: cdnf-folder-overview
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/00-overview
