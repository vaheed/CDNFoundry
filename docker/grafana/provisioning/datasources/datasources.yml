apiVersion: 1

deleteDatasources:
  - { name: Prometheus, orgId: 1 }
  - { name: ClickHouse, orgId: 1 }
  - { name: CDNFoundry control database, orgId: 1 }
  - { name: Loki, orgId: 1 }
  - { name: Alertmanager, orgId: 1 }

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${GRAFANA_LOKI_URL}
    editable: false
    jsonData:
      timeout: 30
      maxLines: 5000
      # A value in a log line opens the dashboard that explains it.
      derivedFields:
        - name: request_id
          matcherType: label
          matcherRegex: request_id
          url: '/d/cdnf-request-trace?var-request_id=${__value.raw}'
          urlDisplayLabel: Request trace
        - name: domain_id
          matcherType: label
          matcherRegex: domain_id
          url: '/d/cdnf-domain-overview?var-domain=${__value.raw}'
          urlDisplayLabel: Domain overview
        - name: pop
          matcherType: label
          matcherRegex: host
          url: '/d/cdnf-pop-detail?var-pop=${__value.raw}'
          urlDisplayLabel: PoP detail
        - name: edge
          matcherType: label
          matcherRegex: collector_id
          url: '/d/cdnf-pop-detail?var-pop=${__value.raw}'
          urlDisplayLabel: PoP detail

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    jsonData:
      defaultDatabase: cdnf
      host: ${GRAFANA_CLICKHOUSE_HOST}
      port: ${GRAFANA_CLICKHOUSE_PORT}
      protocol: ${GRAFANA_CLICKHOUSE_PROTOCOL}
      secure: ${GRAFANA_CLICKHOUSE_SECURE}
      tlsSkipVerify: false
      username: ${GRAFANA_CLICKHOUSE_USER}
      dialTimeout: "5"
      queryTimeout: "30"
    secureJsonData:
      password: ${GRAFANA_CLICKHOUSE_PASSWORD}

  - name: CDNFoundry control database
    uid: control-db
    type: postgres
    access: proxy
    url: ${GRAFANA_POSTGRES_HOST}:${GRAFANA_POSTGRES_PORT}
    user: ${GRAFANA_POSTGRES_USER}
    database: ${GRAFANA_POSTGRES_DATABASE}
    editable: false
    jsonData:
      database: ${GRAFANA_POSTGRES_DATABASE}
      postgresVersion: 1800
      sslmode: ${GRAFANA_POSTGRES_SSLMODE}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300
    secureJsonData:
      password: ${GRAFANA_POSTGRES_PASSWORD}

  # Grafana-managed alerts (the ClickHouse signals) go to the same Alertmanager as Prometheus alerts, so
  # routing, inhibition, and receivers are defined once.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: true
