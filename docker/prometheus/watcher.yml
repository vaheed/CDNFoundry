# A standby control node watches the active node with nothing but node exporters. It runs no telemetry
# stack, so losing the active node still produces an alert from this node's own Alertmanager.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/control-ha-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/node-targets.yml]
        refresh_interval: 30s
