      runbook_url: https://vaheed.github.io/CDNFoundry/operations/runbooks#edge-latency-burn
      dashboard_url: /d/cdnf-slos?var-slo=edge_latency
  - alert: SLOBurnPurgePropagationFast
    expr: slo:purge_propagation:bad_ratio_rate1h > 14.4 * 0.01 and slo:purge_propagation:bad_ratio_rate5m > 14.4 * 0.01
