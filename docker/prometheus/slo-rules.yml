# Generated by scripts/observability/build_slo_rules.py. Edit the script, then run it.
groups:
- name: cdnfoundry-slo-recordings
  interval: 1m
  rules:
  - record: slo:edge_availability:bad_ratio_rate5m
    expr: 1 - avg(avg_over_time(probe_success{job="blackbox-http"}[5m]))
  - record: slo:edge_availability:bad_ratio_rate30m
    expr: 1 - avg(avg_over_time(probe_success{job="blackbox-http"}[30m]))
  - record: slo:edge_availability:bad_ratio_rate1h
    expr: 1 - avg(avg_over_time(probe_success{job="blackbox-http"}[1h]))
  - record: slo:edge_availability:bad_ratio_rate6h
    expr: 1 - avg(avg_over_time(probe_success{job="blackbox-http"}[6h]))
  - record: slo:edge_availability:objective
    expr: vector(0.999)
  - record: slo:edge_availability:error_budget
    expr: vector(0.001)
  - record: slo:edge_availability:bad_ratio_30d
    expr: avg_over_time(slo:edge_availability:bad_ratio_rate1h[30d])
  - record: slo:edge_availability:budget_remaining
    expr: 1 - clamp_max(slo:edge_availability:bad_ratio_30d / 0.001, 1)
  - record: slo:edge_5xx:bad_ratio_rate5m
    expr: sum(rate(cdnf_edge_requests_total{status_class="5xx"}[5m])) / sum(rate(cdnf_edge_requests_total[5m]))
  - record: slo:edge_5xx:bad_ratio_rate30m
    expr: sum(rate(cdnf_edge_requests_total{status_class="5xx"}[30m])) / sum(rate(cdnf_edge_requests_total[30m]))
  - record: slo:edge_5xx:bad_ratio_rate1h
    expr: sum(rate(cdnf_edge_requests_total{status_class="5xx"}[1h])) / sum(rate(cdnf_edge_requests_total[1h]))
  - record: slo:edge_5xx:bad_ratio_rate6h
    expr: sum(rate(cdnf_edge_requests_total{status_class="5xx"}[6h])) / sum(rate(cdnf_edge_requests_total[6h]))
  - record: slo:edge_5xx:objective
    expr: vector(0.999)
  - record: slo:edge_5xx:error_budget
    expr: vector(0.001)
  - record: slo:edge_5xx:bad_ratio_30d
    expr: avg_over_time(slo:edge_5xx:bad_ratio_rate1h[30d])
  - record: slo:edge_5xx:budget_remaining
    expr: 1 - clamp_max(slo:edge_5xx:bad_ratio_30d / 0.001, 1)
  - record: slo:edge_latency:bad_ratio_rate5m
    expr: 1 - sum(rate(cdnf_edge_request_duration_seconds_bucket{le="0.5"}[5m])) / sum(rate(cdnf_edge_request_duration_seconds_count[5m]))
  - record: slo:edge_latency:bad_ratio_rate30m
    expr: 1 - sum(rate(cdnf_edge_request_duration_seconds_bucket{le="0.5"}[30m])) / sum(rate(cdnf_edge_request_duration_seconds_count[30m]))
  - record: slo:edge_latency:bad_ratio_rate1h
    expr: 1 - sum(rate(cdnf_edge_request_duration_seconds_bucket{le="0.5"}[1h])) / sum(rate(cdnf_edge_request_duration_seconds_count[1h]))
  - record: slo:edge_latency:bad_ratio_rate6h
    expr: 1 - sum(rate(cdnf_edge_request_duration_seconds_bucket{le="0.5"}[6h])) / sum(rate(cdnf_edge_request_duration_seconds_count[6h]))
  - record: slo:edge_latency:objective
    expr: vector(0.95)
  - record: slo:edge_latency:error_budget
    expr: vector(0.05)
  - record: slo:edge_latency:bad_ratio_30d
    expr: avg_over_time(slo:edge_latency:bad_ratio_rate1h[30d])
  - record: slo:edge_latency:budget_remaining
    expr: 1 - clamp_max(slo:edge_latency:bad_ratio_30d / 0.05, 1)
  - record: slo:purge_propagation:bad_ratio_rate5m
    expr: avg_over_time((cdnfoundry_purge_pending_oldest_seconds > bool 30)[5m:1m])
  - record: slo:purge_propagation:bad_ratio_rate30m
    expr: avg_over_time((cdnfoundry_purge_pending_oldest_seconds > bool 30)[30m:1m])
  - record: slo:purge_propagation:bad_ratio_rate1h
    expr: avg_over_time((cdnfoundry_purge_pending_oldest_seconds > bool 30)[1h:1m])
  - record: slo:purge_propagation:bad_ratio_rate6h
    expr: avg_over_time((cdnfoundry_purge_pending_oldest_seconds > bool 30)[6h:1m])
  - record: slo:purge_propagation:objective
    expr: vector(0.99)
  - record: slo:purge_propagation:error_budget
    expr: vector(0.01)
  - record: slo:purge_propagation:bad_ratio_30d
    expr: avg_over_time(slo:purge_propagation:bad_ratio_rate1h[30d])
  - record: slo:purge_propagation:budget_remaining
    expr: 1 - clamp_max(slo:purge_propagation:bad_ratio_30d / 0.01, 1)
  - record: slo:config_propagation:bad_ratio_rate5m
    expr: avg_over_time((cdnfoundry_config_pending_oldest_seconds > bool 120)[5m:1m])
  - record: slo:config_propagation:bad_ratio_rate30m
    expr: avg_over_time((cdnfoundry_config_pending_oldest_seconds > bool 120)[30m:1m])
  - record: slo:config_propagation:bad_ratio_rate1h
    expr: avg_over_time((cdnfoundry_config_pending_oldest_seconds > bool 120)[1h:1m])
  - record: slo:config_propagation:bad_ratio_rate6h
    expr: avg_over_time((cdnfoundry_config_pending_oldest_seconds > bool 120)[6h:1m])
  - record: slo:config_propagation:objective
    expr: vector(0.99)
  - record: slo:config_propagation:error_budget
    expr: vector(0.01)
  - record: slo:config_propagation:bad_ratio_30d
    expr: avg_over_time(slo:config_propagation:bad_ratio_rate1h[30d])
  - record: slo:config_propagation:budget_remaining
    expr: 1 - clamp_max(slo:config_propagation:bad_ratio_30d / 0.01, 1)
  - record: slo:dns_answer:bad_ratio_rate5m
    expr: sum(rate(cdnf_dns_queries_total{rcode="SERVFAIL"}[5m])) / sum(rate(cdnf_dns_queries_total[5m]))
  - record: slo:dns_answer:bad_ratio_rate30m
    expr: sum(rate(cdnf_dns_queries_total{rcode="SERVFAIL"}[30m])) / sum(rate(cdnf_dns_queries_total[30m]))
  - record: slo:dns_answer:bad_ratio_rate1h
    expr: sum(rate(cdnf_dns_queries_total{rcode="SERVFAIL"}[1h])) / sum(rate(cdnf_dns_queries_total[1h]))
  - record: slo:dns_answer:bad_ratio_rate6h
    expr: sum(rate(cdnf_dns_queries_total{rcode="SERVFAIL"}[6h])) / sum(rate(cdnf_dns_queries_total[6h]))
  - record: slo:dns_answer:objective
    expr: vector(0.999)
  - record: slo:dns_answer:error_budget
    expr: vector(0.001)
  - record: slo:dns_answer:bad_ratio_30d
    expr: avg_over_time(slo:dns_answer:bad_ratio_rate1h[30d])
  - record: slo:dns_answer:budget_remaining
    expr: 1 - clamp_max(slo:dns_answer:bad_ratio_30d / 0.001, 1)
  - record: slo:telemetry_delivery:bad_ratio_rate5m
    expr: sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[5m])) / (sum(rate(vector_component_sent_events_total{component_id=~"clickhouse_.*"}[5m])) + sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[5m])))
  - record: slo:telemetry_delivery:bad_ratio_rate30m
    expr: sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[30m])) / (sum(rate(vector_component_sent_events_total{component_id=~"clickhouse_.*"}[30m])) + sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[30m])))
  - record: slo:telemetry_delivery:bad_ratio_rate1h
    expr: sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[1h])) / (sum(rate(vector_component_sent_events_total{component_id=~"clickhouse_.*"}[1h])) + sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[1h])))
  - record: slo:telemetry_delivery:bad_ratio_rate6h
    expr: sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[6h])) / (sum(rate(vector_component_sent_events_total{component_id=~"clickhouse_.*"}[6h])) + sum(rate(vector_component_discarded_events_total{component_id=~"clickhouse_.*"}[6h])))
  - record: slo:telemetry_delivery:objective
    expr: vector(0.999)
  - record: slo:telemetry_delivery:error_budget
    expr: vector(0.001)
  - record: slo:telemetry_delivery:bad_ratio_30d
    expr: avg_over_time(slo:telemetry_delivery:bad_ratio_rate1h[30d])
  - record: slo:telemetry_delivery:budget_remaining
    expr: 1 - clamp_max(slo:telemetry_delivery:bad_ratio_30d / 0.001, 1)
- name: cdnfoundry-slo-burn-rate
  rules:
  - alert: SLOBurnEdgeAvailabilityFast
    expr: slo:edge_availability:bad_ratio_rate1h > 14.4 * 0.001 and slo:edge_availability:bad_ratio_rate5m > 14.4 * 0.001
    for: 2m
    labels:
      team: noc
      severity: critical
      slo: edge_availability
    annotations:
      summary: Edge availability is burning its error budget 14.4 times too fast over 1h and 5m
      runbook_url: https://vaheed.github.io/CDNFoundry/operations/runbooks#edge-availability-burn
      dashboard_url: /d/cdnf-slos?var-slo=edge_availability
  - alert: SLOBurnEdgeAvailabilitySlow
    expr: slo:edge_availability:bad_ratio_rate6h > 6 * 0.001 and slo:edge_availability:bad_ratio_rate30m > 6 * 0.001
    for: 15m
    labels:
      team: noc
      severity: warning
      slo: edge_availability
    annotations:
      summary: Edge availability is burning its error budget 6 times too fast over 6h and 30m
      runbook_url: https://vaheed.github.io/CDNFoundry/operations/runbooks#edge-availability-burn
      dashboard_url: /d/cdnf-slos?var-slo=edge_availability
  - alert: SLOBurnEdge5xxFast
