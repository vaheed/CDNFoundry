groups:
  - name: cdnfoundry-operations
    rules:
      - alert: ControlPlaneMetricsUnavailable
        expr: up{job="cdnfoundry-control"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: CDNFoundry operational metrics are unavailable
      - alert: CDNFoundryComponentUnhealthy
        expr: cdnfoundry_component_health == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A CDNFoundry dependency or reconciliation component is degraded
      - alert: CDNFoundryQueueBacklog
        expr: cdnfoundry_queue_depth > 1000 or cdnfoundry_queue_oldest_job_age_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A bounded CDNFoundry worker lane has excessive depth or age
      - alert: CDNFoundryFailedOperations
        expr: cdnfoundry_operations_failed > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: CDNFoundry has failed operations requiring inspection
      - alert: CDNFoundryCertificateExpiry
        expr: cdnfoundry_tls_certificates_expiring > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: One or more active TLS certificates are inside the expiry alert window
      - alert: DNSDistUnavailable
        expr: up{job="dnsdist"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: DNSdist authoritative ingress is unavailable
      - alert: EdgeGatewayUnready
        expr: cdnfoundry_edge_gateways_unready > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: One or more enabled edge gateways are not ready
      - alert: EdgeGatewayCandidateRejected
        expr: increase(cdnfoundry_edge_gateway_candidate_rejections_total[10m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: An edge gateway rejected a routing-map candidate and retained its last valid map
      - alert: EdgeGatewayErrors
        expr: increase(cdnfoundry_edge_gateway_errors_total[5m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: An edge gateway is reporting bounded connection or listener errors
      - alert: DNSDistBackendUnavailable
        expr: dnsdist_server_status == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: DNSdist has marked an authoritative backend unavailable
      - alert: HostClockUnsynchronized
        expr: node_timex_sync_status == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: A CDNFoundry host clock is not synchronized
      - alert: HostClockDrift
        expr: abs(node_timex_offset_seconds) > 5
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: A CDNFoundry host clock offset exceeds five seconds
  - name: cdnfoundry-telemetry
    rules:
      - alert: LokiUnavailable
        expr: up{job="loki"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Loki operational-log storage is unavailable; traffic serving remains independent
      - alert: OperationalLogCollectorUnavailable
        expr: up{job=~"operational-log-collector.*"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Prometheus cannot scrape an operational-log collector
      - alert: OperationalLogsDropped
        expr: increase(vector_component_discarded_events_total{job=~"operational-log-collector.*",intentional!="true"}[5m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: An operational-log collector dropped events after reaching a bound
      - alert: OperationalLogDeliveryFailures
        expr: increase(vector_component_errors_total{job=~"operational-log-collector.*",component_id="loki"}[5m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: An operational-log collector cannot deliver to Loki
      - alert: OperationalLogBufferNearLimit
        expr: vector_buffer_size_bytes{job=~"operational-log-collector.*",component_id="loki"} / vector_buffer_max_size_bytes{job=~"operational-log-collector.*",component_id="loki"} > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: An operational-log disk buffer is above 80 percent
      - alert: LokiIngestionRejected
        expr: increase(loki_discarded_samples_total[5m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Loki rejected operational-log lines because an ingestion limit was reached
      - alert: LokiCompactorRetentionStalled
        expr: (loki_compactor_apply_retention_last_successful_run_timestamp_seconds > 0 and time() - loki_compactor_apply_retention_last_successful_run_timestamp_seconds > 3600) or (loki_compactor_apply_retention_last_successful_run_timestamp_seconds == 0 and time() - process_start_time_seconds{job="loki"} > 3600)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Loki compactor retention has not completed successfully for one hour
      - alert: OperationalErrorLogSpike
        expr: sum by (service) (increase(cdnfoundry_operational_log_events{level=~"error|critical"}[5m])) > 20
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: A service emitted more than 20 error logs in five minutes
      - alert: OperationalCriticalServiceSilent
        expr: sum by (service) (increase(cdnfoundry_operational_log_events{service=~"core|edge-agent|edge-gateway|dnsdist|pdns-auth|loki"}[30m])) == 0 and sum by (service) (increase(cdnfoundry_operational_log_events{service=~"core|edge-agent|edge-gateway|dnsdist|pdns-auth|loki"}[30m] offset 30m)) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: A previously active critical service has stopped emitting operational logs
      - alert: LokiHostFilesystemPressure
        expr: 1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: A host filesystem, including the bounded Loki volume host, is over 80 percent full
      - alert: LokiHostFilesystemCritical
        expr: 1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} > 0.9
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: A host filesystem, including the bounded Loki volume host, is over 90 percent full
      - alert: TelemetryEventsDropped
        expr: increase(vector_component_discarded_events_total[5m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Vector dropped telemetry after a bounded buffer or transform limit
      - alert: TelemetryDeliveryFailures
        expr: increase(vector_component_errors_total[5m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Vector is failing to deliver telemetry
      - alert: TelemetryBufferNearLimit
        expr: vector_buffer_byte_size > 858993459
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A Vector telemetry buffer is above 80 percent of its 1 GiB limit
      - alert: TelemetryCollectorUnavailable
        expr: up{job="vector"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Prometheus cannot scrape the Vector telemetry collector
      - alert: EdgeMapStale
        expr: cdnfoundry_pool_endpoint_revision_mismatch == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: An edge endpoint has not acknowledged its desired map
          runbook: /operations/runbooks#stale-edge-map-or-endpoint-mismatch
      - alert: EdgeCellCapacityPressure
        expr: cdnfoundry_cell_capacity_ratio >= 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A bounded edge-cell resource is nearing its limit
          runbook: /operations/runbooks#cell-cache-or-compression-pressure
      - alert: FleetRolloutPaused
        expr: cdnfoundry_fleet_rollouts_paused > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: A fleet rollout paused on a safety threshold
          runbook: /operations/runbooks#paused-fleet-rollout
