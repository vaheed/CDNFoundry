global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/telemetry-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: cdnfoundry-control
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics-token
    file_sd_configs:
      - files: [/etc/prometheus/control-targets.yml]
        refresh_interval: 30s
  - job_name: vector
    static_configs:
      - targets: [vector:9598]
  - job_name: operational-log-collector
    static_configs:
      - targets: [log-collector:9599]
  - job_name: operational-log-collector-remote
    file_sd_configs:
      - files: [/etc/prometheus/operational-log-targets.yml]
        refresh_interval: 30s
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/node-targets.yml]
        refresh_interval: 30s
  - job_name: dnsdist
    file_sd_configs:
      - files: [/etc/prometheus/dns-targets.yml]
        refresh_interval: 30s
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: edge-gateway
    file_sd_configs:
      - files: [/etc/prometheus/edge-targets.yml]
        refresh_interval: 30s
  - job_name: clickhouse
    static_configs:
      - targets: [clickhouse:9363]
