global:
  scrape_interval: 15s
storage:
  tsdb:
    # A development seed backfills up to two days through remote write; production never receives remote writes.
    out_of_order_time_window: 49h
rule_files:
  - /etc/prometheus/telemetry-alerts.yml
  - /etc/prometheus/control-ha-alerts.yml
  - /etc/prometheus/traffic-alerts.yml
  - /etc/prometheus/security-alerts.yml
  - /etc/prometheus/slo-rules.yml
  - /etc/prometheus/dashboard-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: cdnfoundry-control
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics-token
    file_sd_configs:
      - files: [/etc/prometheus/control-targets.yml]
        refresh_interval: 30s
  - job_name: vector
    static_configs:
      - targets: [vector:9598]
  - job_name: operational-log-collector
    static_configs:
      - targets: [log-collector:9599]
  - job_name: operational-log-collector-remote
    file_sd_configs:
      - files: [/etc/prometheus/operational-log-targets.yml]
        refresh_interval: 30s
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/node-targets.yml]
        refresh_interval: 30s
  - job_name: dnsdist
    file_sd_configs:
      - files: [/etc/prometheus/dns-targets.yml]
        refresh_interval: 30s
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: edge-gateway
    file_sd_configs:
      - files: [/etc/prometheus/edge-targets.yml]
        refresh_interval: 30s
  - job_name: clickhouse
    static_configs:
      - targets: [clickhouse:9363]
  # Collectors on PoP and DNS hosts export live edge and DNS counters; the `vector` job above is the
  # collector on the monitoring host itself.
  - job_name: vector-pop
    file_sd_configs:
      - files: [/etc/prometheus/vector-targets.yml]
        refresh_interval: 30s
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  # Synthetic probes. Each target file entry names its probe module, PoP, region, and IP version.
  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_up] }
    file_sd_configs:
      - files: [/etc/prometheus/probe-targets.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [probe]
        regex: http
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox-tcp
    metrics_path: /probe
    params: { module: [tcp_connect] }
    file_sd_configs:
      - files: [/etc/prometheus/probe-targets.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [probe]
        regex: tcp
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox-dns-udp
    metrics_path: /probe
    params: { module: [dns_udp] }
    file_sd_configs:
      - files: [/etc/prometheus/probe-targets.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [probe]
        regex: dns_udp
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox-dns-tcp
    metrics_path: /probe
    params: { module: [dns_tcp] }
    file_sd_configs:
      - files: [/etc/prometheus/probe-targets.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [probe]
        regex: dns_tcp
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
  # Development only: the seed exporter's fake PoPs. Production mounts no targets, so this job stays empty there.
  - job_name: seed
    honor_labels: true
    file_sd_configs:
      - files: [/etc/prometheus/seed-targets.yml]
        refresh_interval: 30s
