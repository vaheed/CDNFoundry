load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_modsecurity_module.so;

env EDGE_RUNTIME_FILE;
env EDGE_STATUS_TOKEN;
env EDGE_CELL_NAME;
env GEOIP_DATABASE;
env EDGE_COMPRESSION_DISABLED;

user cdnf cdnf;

worker_processes auto;
error_log /dev/stderr notice;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # Named cache redirects do not re-run server-level set directives. Avoid
    # raw request lines in warning diagnostics for optional telemetry fields.
    uninitialized_variable_warn off;
    map $sent_http_content_encoding $cdn_compression_ratio {
        default 1;
        gzip $gzip_ratio;
        br $brotli_ratio;
    }
    client_body_temp_path /var/lib/nginx/tmp/client_body 1 2;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;
    proxy_cache_path /var/cache/nginx/content/small levels=1:2 keys_zone=cache_small:8m max_size=256m inactive=30m min_free=32m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/content/standard levels=1:2 keys_zone=cache_standard:16m max_size=1g inactive=1h min_free=64m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/content/large levels=1:2 keys_zone=cache_large:32m max_size=4g inactive=6h min_free=256m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/content/streaming levels=1:2 keys_zone=cache_streaming:32m max_size=8g inactive=24h min_free=512m use_temp_path=off;
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary off;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv text/xml application/json application/javascript application/manifest+json application/rss+xml application/atom+xml application/xml application/xhtml+xml application/svg+xml application/wasm font/ttf font/otf application/vnd.ms-fontobject;
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_static off;
    brotli_types text/plain text/css text/csv text/xml application/json application/javascript application/manifest+json application/rss+xml application/atom+xml application/xml application/xhtml+xml application/svg+xml application/wasm font/ttf font/otf application/vnd.ms-fontobject;
    log_format edge_json escape=json '{"occurred_at":"$time_iso8601","domain_id":$cdn_domain_id,"hostname":"$host","method":"$request_method","path":"$uri","status":$status,"bytes_in":$request_length,"bytes_out":$body_bytes_sent,"cache_status":"$upstream_cache_status","origin_latency_ms":null,"origin_error":"$upstream_status","origin_role":"$upstream_http_x_cdnfoundry_origin","origin_transition":"$upstream_http_x_cdnfoundry_origin_transition","tls_error":"","security_action":"$cdn_security_action","security_reason":"$cdn_security_reason","edge_id":"$cdn_edge_id","client_ip":"$cdn_client_ip","country":"$cdn_country","continent":"$cdn_continent","user_agent":"$http_user_agent","referrer":"$http_referer","event_type":"request","compression_encoding":"$sent_http_content_encoding","compression_ratio":$cdn_compression_ratio,"compression_profile":"$cdn_compression_profile","compression_fallback":"$cdn_compression_fallback","waf_profile":"$cdn_waf_profile","waf_rule_id":$cdn_waf_rule_id,"waf_score":$cdn_waf_score,"waf_action":"$cdn_waf_action","waf_processing_us":$cdn_waf_processing_us,"waf_body_limit":"$cdn_waf_body_limit","waf_exclusion_id":$cdn_waf_exclusion_id}';
    access_log /dev/stdout edge_json;
    access_log syslog:server=vector:9000,facility=local7,tag=cdnfoundry_edge,nohostname edge_json;
    sendfile on;
    include /etc/nginx/conf.d/*.conf;
}
