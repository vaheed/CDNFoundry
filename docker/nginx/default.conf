# Alertmanager's receiver is bounded at the door: a few requests a second and a small body, before PHP is involved.
limit_req_zone $server_name zone=alert_receiver:64k rate=5r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    root /app/public;
    index index.php;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Edge enrollment and agent traffic are served only by edge-control over
    # TLS/mTLS. Never allow the ordinary browser/API ingress to reach them.
    location ^~ /edge/v1/ {
        return 404;
    }

    location = /internal/alertmanager {
        limit_req zone=alert_receiver burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_EDGE_CERTIFICATE_VERIFY "";
        fastcgi_param HTTP_X_EDGE_CERTIFICATE_SERIAL "";
        fastcgi_param HTTP_X_EDGE_CERTIFICATE_PEM "";
        fastcgi_param HTTP_X_EDGE_PROXY_SECRET "";
        set $php_upstream core-fpm:9000;
        fastcgi_pass $php_upstream;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
