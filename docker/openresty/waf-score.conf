Include /etc/cdnfoundry/modsecurity.conf
Include /etc/cdnfoundry/crs-setup.conf
SecRule REQUEST_HEADERS:X-CDNF-Internal-WAF-Paranoia "@rx ^[1-4]$" "id:1000104,phase:1,pass,nolog,setvar:tx.executing_paranoia_level=%{MATCHED_VAR},setvar:tx.paranoia_level=%{MATCHED_VAR},setvar:tx.blocking_paranoia_level=%{MATCHED_VAR}"
SecAction "id:1000103,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=100000"
Include /etc/cdnfoundry/crs/rules/*.conf
SecAction "id:1000110,phase:2,nolog,redirect:'/score?total=%{tx.blocking_inbound_anomaly_score}&sqli=%{tx.sql_injection_score}&xss=%{tx.xss_score}&rce=%{tx.rce_score}'"
