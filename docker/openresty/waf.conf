Include /etc/cdnfoundry/modsecurity.conf
SecRule REQUEST_HEADERS:X-CDNFoundry-Internal-WAF-Mode "!@rx ^(?:off|monitor|block)$" "id:1000000,phase:1,deny,status:403,nolog"
SecRule REQUEST_HEADERS:X-CDNFoundry-Internal-WAF-Mode "@streq off" "id:1000001,phase:1,pass,nolog,ctl:ruleEngine=Off"
SecRule REQUEST_HEADERS:X-CDNFoundry-Internal-WAF-Mode "@streq monitor" "id:1000002,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
Include /etc/cdnfoundry/crs-setup.conf
SecRule REQUEST_HEADERS:X-CDNFoundry-Internal-WAF-Threshold "@rx ^(?:[1-9]|[1-9][0-9]|100)$" "id:1000003,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=%{MATCHED_VAR}"
SecRule REQUEST_HEADERS:X-CDNFoundry-Internal-WAF-Paranoia "@rx ^[1-4]$" "id:1000004,phase:1,pass,nolog,setvar:tx.executing_paranoia_level=%{MATCHED_VAR},setvar:tx.paranoia_level=%{MATCHED_VAR}"
Include /etc/cdnfoundry/crs/rules/*.conf
SecRule TX:INBOUND_ANOMALY_SCORE "@ge 1" "id:1000005,phase:5,pass,auditlog,msg:'CDNFoundry sanitized CRS detection summary'"
