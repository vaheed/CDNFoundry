# Every alert carries a `team` label (noc, soc, platform) and is routed by it. All three teams post to one private
# receiver in the control plane (ALERT_RECEIVER_URL, written to /tmp/alert-receiver-url by start.sh), authenticated with
# the monitoring token. The receiver queues the alert for the notifier, which delivers it to the channels
# administrators configure in Platform settings. Alertmanager groups alerts, so the receiver sees a few small
# requests a minute however many domains are firing.
route:
  receiver: platform
  group_by: [alertname, team]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # The heartbeat is repeated often so a notifier can page when it stops.
    - matchers: [alertname = Watchdog]
      receiver: platform
      repeat_interval: 1m
    - matchers: [team = noc]
      receiver: noc
    - matchers: [team = soc]
      receiver: soc
    - matchers: [team = platform]
      receiver: platform
inhibit_rules:
  # A PoP that is down explains every per-domain, per-PoP symptom it causes.
  - source_matchers: [alertname =~ "EdgeHeartbeatStale|PopTrafficDropped"]
    target_matchers: [alertname =~ "EdgePop5xxRatioHigh|EdgeOriginFailureRatioHigh|RequestFloodOnEdge|EdgeProbeFailing|EdgeGatewayErrors|EdgeCellCapacityPressure|DomainFiveHundredRatioHigh|DomainRequestFlood|DomainSingleNetworkShare"]
    equal: [pop]
  # While the control plane is down, derived staleness alerts only repeat that outage.
  - source_matchers: [alertname =~ "ControlPlaneMetricsUnavailable|ControlNodeUnreachable"]
    target_matchers: [alertname =~ "EdgeHeartbeatStale|EdgeMapStale|ConfigPropagationSlow|PurgePropagationSlow|DnsSerialPropagationSlow|CDNFoundryComponentUnhealthy|CDNFoundryQueueBacklog|EdgeMissingControlAddresses|ControlBackupStale"]
  # A page for a fast burn makes the slow burn of the same SLO redundant.
  - source_matchers: [alertname =~ "SLOBurn.*Fast"]
    target_matchers: [alertname =~ "SLOBurn.*Slow"]
    equal: [slo]
receivers:
  - name: noc
    webhook_configs:
      - url_file: /tmp/alert-receiver-url
        send_resolved: true
        max_alerts: 200
        http_config:
          authorization:
            credentials_file: /run/secrets/metrics-token
  - name: soc
    webhook_configs:
      - url_file: /tmp/alert-receiver-url
        send_resolved: true
        max_alerts: 200
        http_config:
          authorization:
            credentials_file: /run/secrets/metrics-token
  - name: platform
    webhook_configs:
      - url_file: /tmp/alert-receiver-url
        send_resolved: true
        max_alerts: 200
        http_config:
          authorization:
            credentials_file: /run/secrets/metrics-token
