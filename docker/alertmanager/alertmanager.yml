# Every alert carries a `team` label (noc, soc, platform) and is routed by it. start.sh writes the
# webhook URL to /tmp/alert-webhook-url from ALERT_WEBHOOK_URL. Without one it removes the webhook_configs lines
# below, so the receivers send nothing and Alertmanager still starts. A
# deployment points all three teams at one webhook, or overrides a receiver with its own notifier.
route:
  receiver: platform
  group_by: [alertname, team]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # The heartbeat is repeated often so a notifier can page when it stops.
    - matchers: [alertname = Watchdog]
      receiver: platform
      repeat_interval: 1m
    - matchers: [team = noc]
      receiver: noc
    - matchers: [team = soc]
      receiver: soc
    - matchers: [team = platform]
      receiver: platform
inhibit_rules:
  # A PoP that is down explains every per-domain, per-PoP symptom it causes.
  - source_matchers: [alertname =~ "EdgeHeartbeatStale|PopTrafficDropped"]
    target_matchers: [alertname =~ "EdgePop5xxRatioHigh|EdgeOriginFailureRatioHigh|RequestFloodOnEdge|EdgeProbeFailing|EdgeGatewayErrors|EdgeCellCapacityPressure|DomainFiveHundredRatioHigh|DomainRequestFlood|DomainSingleNetworkShare"]
    equal: [pop]
  # While the control plane is down, derived staleness alerts only repeat that outage.
  - source_matchers: [alertname =~ "ControlPlaneMetricsUnavailable|ControlNodeUnreachable"]
    target_matchers: [alertname =~ "EdgeHeartbeatStale|EdgeMapStale|ConfigPropagationSlow|PurgePropagationSlow|DnsSerialPropagationSlow|CDNFoundryComponentUnhealthy|CDNFoundryQueueBacklog|EdgeMissingControlAddresses|ControlBackupStale"]
  # A page for a fast burn makes the slow burn of the same SLO redundant.
  - source_matchers: [alertname =~ "SLOBurn.*Fast"]
    target_matchers: [alertname =~ "SLOBurn.*Slow"]
    equal: [slo]
receivers:
  - name: noc
    webhook_configs:
      - url_file: /tmp/alert-webhook-url
        send_resolved: true
  - name: soc
    webhook_configs:
      - url_file: /tmp/alert-webhook-url
        send_resolved: true
  - name: platform
    webhook_configs:
      - url_file: /tmp/alert-webhook-url
        send_resolved: true
