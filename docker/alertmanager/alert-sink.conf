# Development notifier: logs each Alertmanager webhook body to stdout. nginx only
# reads a request body when it proxies the request, so the front server
# forwards to a local responder.
log_format alerts '$request_body';
server {
    listen 8080;
    access_log /dev/stdout alerts;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    location / { proxy_pass http://127.0.0.1:8081; }
}
server {
    listen 127.0.0.1:8081;
    access_log off;
    location / { return 200 "ok\n"; }
}
