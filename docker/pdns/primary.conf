# The hidden primary. Laravel writes every zone here through the API; DNS nodes pull the zones
# from it over signed transfers. It answers no public queries, so it needs no GeoIP data: the
# LUA records it stores are evaluated on the nodes.
launch=gpgsql
gpgsql-host=pdns-db
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns
gpgsql-password=pdns-dev-only
primary=yes
secondary=no
# Transfers are allowed only to requests signed with the TSIG key set as TSIG-ALLOW-AXFR on each
# zone, so no address allowlist is configured here.
local-address=0.0.0.0
local-port=5300
enable-lua-records=yes
enable-lua-record-updates=yes
lua-records-exec-limit=1000
api=yes
api-key=pdns-dev-api-key
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0
default-soa-content=ns1.cdnf.test hostmaster.cdnf.test 0 10800 3600 604800 3600
# version.bind answers REFUSED instead of naming the PowerDNS build.
version-string=anonymous
