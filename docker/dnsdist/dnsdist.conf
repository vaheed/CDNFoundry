setLocal('0.0.0.0:53')
setACL({'0.0.0.0/0', '::/0'})

-- Bound abusive clients before they consume private authoritative capacity.
-- A global ceiling limits spoofed-source floods; neither rule calls Laravel.
addAction(MaxQPSIPRule(500, 32, 64, 500, 30, 5), DropAction())
addAction(NotRule(MaxQPSRule(50000)), DropAction())

-- Prometheus reaches this read-only statistics endpoint only on the private
-- DNS network. Configuration-changing API routes remain authenticated and are
-- not enabled by this deployment.
webserver('0.0.0.0:8083')
setWebserverConfig({
  acl='0.0.0.0/0, ::/0',
  statsRequireAuthentication=false,
  apiRequiresAuthentication=true
})

-- PowerDNS sees DNSdist, not the resolver. useClientSubnet forwards the client
-- network as EDNS Client Subnet when the query carries none, and an ECS option
-- the resolver sent is kept, so Geo-DNS always decides on the client network.
setECSSourcePrefixV4(24)
setECSSourcePrefixV6(56)
setECSOverride(false)

-- Backends are resolved again every 15 seconds. A recreated PowerDNS container
-- usually gets a new address, and a backend pinned at start-up would stay down.
backends = {}
function addResolvedBackends(hostname, addresses)
  local wanted = {}
  for _, address in ipairs(addresses) do
    local ip = address:toString()
    wanted[ip] = true
    if backends[ip] == nil then
      backends[ip] = newServer({address=ip, name=hostname, useClientSubnet=true})
    end
  end
  for ip, server in pairs(backends) do
    if not wanted[ip] then
      rmServer(server)
      backends[ip] = nil
    end
  end
end

getAddressInfo('pdns-auth', addResolvedBackends)

lastBackendResolution = os.time()
function maintenance()
  if os.time() - lastBackendResolution >= 15 then
    lastBackendResolution = os.time()
    getAddressInfo('pdns-auth', addResolvedBackends)
  end
end
setServerPolicy(firstAvailable)

-- Deliberately no packet cache: ACME TXT publication and deletion become
-- visible on the next DNSdist query without a control-plane cache flush.

-- Telemetry is best-effort and bounded inside dnsdist/libfstrm. A disconnected
-- Vector endpoint never participates in query processing or backend selection.
function addDnstapLogger(hostname, addresses)
  for _, address in ipairs(addresses) do
    dnstapLogger = newFrameStreamTcpLogger(address:toString() .. ':6000', {
      bufferHint=8192,
      flushTimeout=1,
      inputQueueSize=1024,
      outputQueueSize=1024,
      queueNotifyThreshold=32,
      reopenInterval=1
    })
    addResponseAction(AllRule(), DnstapLogResponseAction('cdnfoundry-dnsdist', dnstapLogger))
    return
  end
end
getAddressInfo('vector', addDnstapLogger)
