; Production-safe PHP settings for every core-image process.
; Never advertise the version, never print errors into responses, and keep
; upload-progress session data off. Errors still reach the container log: with no error_log, PHP writes to stderr, which an unprivileged process can still use.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
session.upload_progress.enabled = Off
