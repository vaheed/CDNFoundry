name: cdnfoundry-dev

x-bounded-logging: &bounded-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-core-env: &core-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: control-db
  DB_PORT: 5432
  DB_DATABASE: cdnf
  DB_USERNAME: cdnf
  DB_PASSWORD: cdnf-dev-only
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_CACHE_HOST: cache
  REDIS_CLIENT: predis
  GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb
  ACME_ENABLED: "true"
  ACME_DIRECTORY_URL: https://pebble:14000/dir
  ACME_VERIFY_TLS: "false"
  ACME_CONTACT_EMAIL: admin@example.test
  ACME_INITIAL_JITTER_SECONDS: "1"
  ACME_DNS_PROBE_SERVER: dnsdist
  EDGE_IDENTITY_CA_CERTIFICATE: /run/dev-pki/edge-identity-ca.crt
  EDGE_PROXY_SECRET_FILE: /run/dev-pki/edge-proxy-secret.conf
  # PHP-FPM listens only here, on the private network it shares with the web containers.
  FPM_LISTEN_ALIAS: core-fpm
  EDGE_IDENTITY_CA_PRIVATE_KEY: /run/dev-pki/edge-identity-ca.key
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DATABASE: cdnf
  CLICKHOUSE_USER: cdnf_reader
  CLICKHOUSE_PASSWORD: cdnf-reader-dev-only
  CLICKHOUSE_ZONES_PASSWORD: cdnf-zones-dev-only
  PROMETHEUS_URL: http://prometheus:9090
  METRICS_TOKEN_FILE: /run/dev-metrics/metrics-token
  RESTIC_REPOSITORY: /app/storage/app/restic
  RESTIC_PASSWORD_FILE: /run/dev-backup/restic-password
  LOG_CHANNEL: stderr
  LOG_STACK: stderr
  LOG_STDERR_FORMATTER: App\Logging\OperationalJsonFormatter
  GRAFANA_EXPLORE_URL: ${GRAFANA_EXPLORE_URL:-http://localhost:3000/explore?left=%7B%22datasource%22:%22loki%22%7D}

x-core: &core
  <<: *hardened
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  mem_limit: 1g
  logging: *bounded-logging
  build:
    context: ./core
    target: development
  environment: *core-env
  volumes:
    - ./core:/app
    - ./docs:/docs
    - ./tests:/tests:ro
    - ./AGENTS.md:/AGENTS.md:ro
    - ./.agents:/.agents:ro
    - core-vendor:/app/vendor
    # Runtime storage is initialized by the entrypoint. Disabling Docker's
    # automatic copy-up prevents concurrent core workers from racing while a
    # brand-new shared volume is populated.
    - type: volume
      source: core-storage
      target: /app/storage
      volume:
        nocopy: true
    - core-bootstrap-cache:/app/bootstrap/cache
    - mmdb:/mmdb:ro
    - dev-pki:/run/dev-pki:ro
    - ./docker/prometheus/dev-metrics-token:/run/dev-metrics/metrics-token:ro
    - ./docker/backup/dev-restic-password:/run/dev-backup/restic-password:ro
  depends_on:
    dev-pki: { condition: service_completed_successfully }
    vendor-init: { condition: service_completed_successfully }
    control-db: { condition: service_healthy }
    redis: { condition: service_healthy }
    cache: { condition: service_healthy }
  networks: [control, telemetry, dns]
  restart: unless-stopped

x-dev-cell-env: &dev-cell-env
  EDGE_STATUS_TOKEN: ${CDNF_DEV_EDGE_STATUS_TOKEN:-cdnf-dev-edge-status-only}
  GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb
  EDGE_PROXY_PROTOCOL_TRUSTED_CIDRS: 172.28.10.0/24,172.28.11.0/24,172.28.20.0/24,172.28.21.0/24,fd00:cd0f:10::/64

x-dev-cell: &dev-cell
  <<: *hardened
  cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
  logging: *bounded-logging
  build:
    context: .
    dockerfile: docker/openresty/Dockerfile
  tmpfs:
    - /var/lib/nginx/tmp:rw,noexec,nosuid,size=64m
  mem_limit: 512m
  cpus: 0.5
  pids_limit: 128
  ulimits: { nofile: { soft: 65536, hard: 65536 } }
  sysctls: { net.ipv4.tcp_syncookies: "1" }
  networks: [edge]
  depends_on:
    dev-pki: { condition: service_completed_successfully }
    origin-http: { condition: service_started }
    mmdb-updater: { condition: service_healthy }
  restart: unless-stopped
  healthcheck:
    test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 120s

services:
  dev-pki:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: docker/dev-pki/Dockerfile
    volumes: [dev-pki:/pki]
    restart: "no"

  vendor-init:
    logging: *bounded-logging
    build:
      context: ./core
      target: development
    entrypoint: [sh, -c]
    # Keep the live dependency tree usable while one-off Compose commands refresh it.
    # Packages are overlaid first; authoritative Composer metadata is published last.
    command:
      - >-
        find /opt/cdnf-vendor -mindepth 1 -maxdepth 1 -type d ! -name composer
        -exec cp -a {} /target/ \; &&
        find /opt/cdnf-vendor -mindepth 1 -maxdepth 1 -type f
        -exec cp -a {} /target/ \; &&
        mkdir -p /target/composer &&
        cp -a /opt/cdnf-vendor/composer/. /target/composer/
    volumes: [core-vendor:/target]
    restart: "no"

  core:
    logging: *bounded-logging
    <<: *core
    networks:
      control: {}
      telemetry: {}
      dns: {}
      fpm: { aliases: [core-fpm] }
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('core-fpm', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 256m
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports: ["8080:8080"]
    volumes:
      - ./core:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core: { condition: service_healthy }
    networks: [control, fpm, ingress]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 10

  edge-control:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 256m
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports: ["${CDNF_DEV_EDGE_CONTROL_BIND:-127.0.0.1:9443}:8443"]
    volumes:
      - ./core:/app:ro
      - ./docker/nginx/edge-control.conf:/etc/nginx/conf.d/default.conf:ro
      - dev-pki:/run/secrets:ro
    depends_on:
      dev-pki: { condition: service_completed_successfully }
      core: { condition: service_healthy }
    networks: [control, fpm, ingress]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -qO-, https://127.0.0.1:8443/healthz]
      interval: 10s
      timeout: 3s
      retries: 10

  horizon:
    logging: *bounded-logging
    <<: *core
    command: [php, artisan, horizon]
    networks: [control, dns]
    healthcheck:
      test: [CMD-SHELL, "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scheduler:
    logging: *bounded-logging
    <<: *core
    command: [php, artisan, schedule:work]
    healthcheck:
      test: [CMD, php, artisan, cdnf:scheduler:check]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  migrate:
    logging: *bounded-logging
    <<: *core
    command: [php, artisan, migrate, --force]
    restart: "no"

  control-db:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 2g
    image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_DB: cdnf
      POSTGRES_USER: cdnf
      POSTGRES_PASSWORD: cdnf-dev-only
    volumes: [control-db:/var/lib/postgresql]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cdnf -d cdnf"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1280m
    image: valkey/valkey:9.1.2-alpine3.24@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    command: [valkey-server, --appendonly, "yes", --maxmemory, 512mb, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    networks: [control]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  cache:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 768m
    image: valkey/valkey:9.1.2-alpine3.24@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
    networks: [control]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-db:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1g
    image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_DB: pdns
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: pdns-dev-only
    volumes:
      - pdns-db:/var/lib/postgresql
      - ./docker/postgres/pdns-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [dns]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pdns -d pdns"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The hidden primary: Laravel writes zones here; the node below pulls them over signed transfers.
  # PowerDNS accepts a primary only as an address, so it has a fixed one.
  pdns-primary:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 512m
    image: powerdns/pdns-auth-51:5.1.4@sha256:bb5b1c133bcca1dd455075321de7d55db4945a8d7f2ba23339e3c7bbe416b205
    volumes:
      - ./docker/pdns/primary.conf:/etc/powerdns/pdns.conf:ro
    depends_on:
      pdns-db: { condition: service_healthy }
    networks:
      dns: { ipv4_address: 172.28.30.10 }
    restart: unless-stopped
    healthcheck:
      test: [CMD, pdns_control, rping]
      interval: 5s
      timeout: 3s
      retries: 20

  # The DNS node: a secondary configured by edge-agent-a through the local API.
  pdns-auth:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 512m
    image: powerdns/pdns-auth-51:5.1.4@sha256:bb5b1c133bcca1dd455075321de7d55db4945a8d7f2ba23339e3c7bbe416b205
    entrypoint:
      - sh
      - -c
      - "[ -e /var/lib/powerdns/pdns.sqlite3 ] || sqlite3 /var/lib/powerdns/pdns.sqlite3 < /usr/local/share/doc/pdns/schema.sqlite3.sql; exec pdns_server --daemon=no --guardian=no --disable-syslog"
    volumes:
      - ./docker/pdns/pdns.conf:/etc/powerdns/pdns.conf:ro
      - ./docker/pdns/geoip-zones.yml:/etc/powerdns/geoip-zones.yml:ro
      - pdns-node:/var/lib/powerdns
      - mmdb:/mmdb:ro
    depends_on:
      mmdb-updater: { condition: service_healthy }
    networks: [dns]
    restart: unless-stopped
    healthcheck:
      test: [CMD, pdns_control, rping]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-migrate:
    logging: *bounded-logging
    <<: *hardened
    mem_limit: 128m
    image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    command: [psql, -v, ON_ERROR_STOP=1, -h, pdns-db, -U, pdns, -d, pdns, -f, /migrations/2026_07_17_000001_add_powerdns_metadata_tables.sql]
    environment: { PGPASSWORD: pdns-dev-only }
    volumes: [./docker/postgres/pdns-migrations:/migrations:ro]
    depends_on:
      pdns-db: { condition: service_healthy }
    networks: [dns]
    restart: "no"

  dnsdist:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 512m
    image: powerdns/dnsdist-21:2.1.2@sha256:efabf173811e27438bebee5f1f40e047f263ea39093a8f7d6097df494cf1ed67
    ports: ["1053:53/udp", "1053:53/tcp"]
    volumes: [./docker/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro]
    depends_on:
      pdns-auth: { condition: service_healthy }
    networks: [dns]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8083/metrics', timeout=2).read(1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  pebble:
    logging: *bounded-logging
    image: ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
    command: [-dnsserver, dnsdist:53]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
      PEBBLE_AUTHZREUSE: "0"
    depends_on:
      dnsdist: { condition: service_started }
    networks: [control, dns]
    restart: unless-stopped

  clickhouse:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 4g
    image: clickhouse/clickhouse-server:26.8.7.19-alpine@sha256:2bece7c646f08865eadc2000a60427e2964adf2b46908a6d476dfa7cc5408720
    environment:
      CLICKHOUSE_DB: cdnf
      CLICKHOUSE_USER: cdnf
      CLICKHOUSE_PASSWORD: cdnf-dev-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      GRAFANA_CLICKHOUSE_PASSWORD: cdnf-grafana-dev-only
      CLICKHOUSE_INGEST_PASSWORD: cdnf-ingest-dev-only
      CLICKHOUSE_READER_PASSWORD: cdnf-reader-dev-only
      CLICKHOUSE_ZONES_PASSWORD: cdnf-zones-dev-only
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./docker/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./docker/clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
      - ./docker/clickhouse/users.d/telemetry.xml:/etc/clickhouse-server/users.d/telemetry.xml:ro
    networks: [telemetry]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8123/ping]
      interval: 10s
      timeout: 3s
      retries: 20

  clickhouse-migrate:
    logging: *bounded-logging
    <<: *hardened
    mem_limit: 256m
    image: clickhouse/clickhouse-server:26.8.7.19-alpine@sha256:2bece7c646f08865eadc2000a60427e2964adf2b46908a6d476dfa7cc5408720
    entrypoint: [sh, /migrate.sh]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: cdnf
      CLICKHOUSE_PASSWORD: cdnf-dev-only
    volumes:
      - ./docker/clickhouse/migrate.sh:/migrate.sh:ro
      - ./docker/clickhouse/migrations:/migrations:ro
    depends_on:
      clickhouse: { condition: service_healthy }
    networks: [telemetry]
    restart: "no"

  vector:
    logging: *bounded-logging
    <<: *hardened
    mem_limit: 512m
    image: timberio/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
    environment:
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      CLICKHOUSE_ENDPOINT: http://clickhouse:8123
      CLICKHOUSE_USER: cdnf_ingest
      CLICKHOUSE_PASSWORD: cdnf-ingest-dev-only
      EDGE_STATUS_TOKEN: ${CDNF_DEV_EDGE_STATUS_TOKEN:-cdnf-dev-edge-status-only}
    volumes:
      - ./docker/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/vector-data-dir
    networks: [telemetry, edge, dns]
    restart: unless-stopped

  loki-data-init:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 64m
    image: busybox:1.37.0-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
    # Loki's image has no shell or HTTP client, so this also supplies a static busybox for its health check.
    command: [sh, -c, "chown 10001:10001 /loki && cp /bin/busybox /tools/busybox && chmod 0555 /tools/busybox"]
    volumes: [loki-data:/loki, loki-tools:/tools]
    restart: "no"

  loki:
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: [-config.file=/etc/loki/loki.yml, -config.expand-env=true]
    ports: ["127.0.0.1:3100:3100"]
    environment:
      LOKI_RETENTION_PERIOD: 168h
      LOKI_MAX_QUERY_LENGTH: 168h
    volumes: [./docker/loki/loki.yml:/etc/loki/loki.yml:ro, loki-data:/loki, loki-tools:/tools:ro]
    depends_on:
      loki-data-init: { condition: service_completed_successfully }
    networks: [telemetry]
    restart: unless-stopped
    healthcheck:
      test: [CMD, /tools/busybox, wget, -q, --spider, http://127.0.0.1:3100/ready]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 30s

  docker-socket-proxy:
    logging: *bounded-logging
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      # Container listing, logs, and events are all the log collector reads. Everything else is refused.
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      SECRETS: "0"
      SERVICES: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped
    tmpfs: [/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 15s
      timeout: 3s
      retries: 5

  log-collector:
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]
    image: timberio/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
    container_name: cdnfoundry-log-collector
    command: [--config, /etc/vector/operational.yaml]
    environment:
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      LOG_ENVIRONMENT: development
      LOG_ROLE: development
      LOG_HOST: ${LOG_HOST:-development}
      LOG_COLLECTOR_ID: ${LOG_COLLECTOR_ID:-development-01}
      LOG_BUFFER_BYTES: "268435488"
      LOG_METRICS_ADDRESS: 0.0.0.0:9599
      LOKI_ENDPOINT: http://loki:3100
      LOG_AUTH_TOKEN: development-only-not-a-secret
    volumes:
      - ./docker/vector/operational.yaml:/etc/vector/operational.yaml:ro
      - operational-vector-data:/vector-data-dir
    depends_on:
      loki: { condition: service_started }
      docker-socket-proxy: { condition: service_healthy }
    ports: ["127.0.0.1:9599:9599"]
    networks: [telemetry, docker-api]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 96
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9599"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  prometheus:
    logging: *bounded-logging
    <<: *hardened
    mem_limit: 1g
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/telemetry-alerts.yml:/etc/prometheus/telemetry-alerts.yml:ro
