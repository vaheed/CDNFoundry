  origin-http:
    logging: *bounded-logging
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    command: [sh, -c, "dd if=/dev/zero of=/tmp/large-object bs=1048576 count=2 >/dev/null 2>&1 && dd if=/dev/zero of=/tmp/graceful-object bs=8192 count=1 >/dev/null 2>&1 && dd if=/dev/zero of=/tmp/single-flight-object bs=2048 count=1 >/dev/null 2>&1 && exec nginx -g 'daemon off;'"]
    tmpfs: [/tmp:size=4m]
    volumes: [./docker/nginx/origin.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [edge]

  origin-https:
    logging: *bounded-logging
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile.origin-https
    command:
      - sh
      - -c
      - >-
        mkdir -p /run/origin &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 1
        -subj /CN=origin-https
        -addext subjectAltName=DNS:origin-https
        -keyout /run/origin/tls.key -out /run/origin/tls.crt >/dev/null 2>&1 &&
        exec nginx -g 'daemon off;'
    tmpfs: [/run/origin]
    volumes: [./docker/nginx/origin-https.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [edge]

