    logging: *bounded-logging
    <<: *edge-b-extra-cell
    environment: { <<: *dev-cell-env, EDGE_CELL_NAME: cell-06, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-06.json }
    volumes: [dev-pki:/run/edge:ro, edge-b-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, edge-b-cell-06-cache:/var/cache/nginx]

  edge-b-cell-07:
    logging: *bounded-logging
    <<: *edge-b-extra-cell
    environment: { <<: *dev-cell-env, EDGE_CELL_NAME: cell-07, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-07.json }
    volumes: [dev-pki:/run/edge:ro, edge-b-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, edge-b-cell-07-cache:/var/cache/nginx]

  edge-b-cell-08:
    logging: *bounded-logging
    <<: *edge-b-extra-cell
    environment: { <<: *dev-cell-env, EDGE_CELL_NAME: cell-08, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-08.json }
    volumes: [dev-pki:/run/edge:ro, edge-b-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, edge-b-cell-08-cache:/var/cache/nginx]

  edge-agent-b:
    logging: *bounded-logging
    build: ./edge-agent
    environment:
      EDGE_CONTROL_URL: https://edge-control:8443
      EDGE_CONTROL_CA_CERTIFICATE: /run/dev-pki/edge-server-ca.crt
      EDGE_ID: ${CDNF_DEV_EDGE_B_ID:-}
      EDGE_BOOTSTRAP_TOKEN: ${CDNF_DEV_EDGE_B_BOOTSTRAP_TOKEN:-}
      EDGE_STATE_DIR: /var/lib/cdnfoundry/agent
      EDGE_RUNTIME_DIR: /var/lib/cdnfoundry/runtime
      EDGE_GATEWAY_STATUS_URL: http://edge-gateway-b:9105/metrics
      EDGE_GATEWAY_ADDRESSES: '["172.28.20.10"]'
      EDGE_CELL_TARGETS: '{"cell-01":{"http":"edge-b:8081","https":"edge-b:8444"},"cell-02":{"http":"edge-b-quarantine:8081","https":"edge-b-quarantine:8444"},"cell-03":{"http":"edge-b-cell-03:8081","https":"edge-b-cell-03:8444"},"cell-04":{"http":"edge-b-cell-04:8081","https":"edge-b-cell-04:8444"},"cell-05":{"http":"edge-b-cell-05:8081","https":"edge-b-cell-05:8444"},"cell-06":{"http":"edge-b-cell-06:8081","https":"edge-b-cell-06:8444"},"cell-07":{"http":"edge-b-cell-07:8081","https":"edge-b-cell-07:8444"},"cell-08":{"http":"edge-b-cell-08:8081","https":"edge-b-cell-08:8444"}}'
      EDGE_CELL_ASSIGNMENTS: '{"cell-01":"shared-default","cell-02":"quarantine-default","cell-03":"","cell-04":"","cell-05":"","cell-06":"","cell-07":"","cell-08":""}'
      EDGE_CELL_STATUS_URLS: http://edge-b:9080/passive-failures,http://edge-b-quarantine:9080/passive-failures,http://edge-b-cell-03:9080/passive-failures,http://edge-b-cell-04:9080/passive-failures,http://edge-b-cell-05:9080/passive-failures,http://edge-b-cell-06:9080/passive-failures,http://edge-b-cell-07:9080/passive-failures,http://edge-b-cell-08:9080/passive-failures
      EDGE_STATUS_TOKEN: ${CDNF_DEV_EDGE_STATUS_TOKEN:-cdnf-dev-edge-status-only}
    volumes:
      - edge-b-agent-state:/var/lib/cdnfoundry/agent
      - edge-b-state:/var/lib/cdnfoundry/runtime
      - dev-pki:/run/dev-pki:ro
    networks: [control, edge, gateway-status]
    depends_on:
      edge-control: { condition: service_healthy }
      edge-b: { condition: service_healthy }
      edge-b-quarantine: { condition: service_started }
      edge-b-cell-03: { condition: service_healthy }
      edge-b-cell-04: { condition: service_healthy }
      edge-b-cell-05: { condition: service_healthy }
      edge-b-cell-06: { condition: service_healthy }
      edge-b-cell-07: { condition: service_healthy }
      edge-b-cell-08: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: [CMD, /usr/local/bin/edge-agent, --healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  edge-gateway-b:
    logging: *bounded-logging
    build: ./edge-gateway
    environment:
      GATEWAY_CONFIG_FILE: /var/lib/cdnfoundry/runtime/current/gateway.json
      GATEWAY_STATE_DIR: /var/lib/cdnfoundry/gateway-state
      GATEWAY_METRICS_ADDRESS: 0.0.0.0:9105
      GATEWAY_MAX_CONNECTIONS: 4096
    volumes:
      - edge-b-state:/var/lib/cdnfoundry/runtime:ro
      - edge-b-gateway-state:/var/lib/cdnfoundry/gateway-state
    ports: ["8082:80", "8445:443"]
    networks:
      gateway-shared-b:
        ipv4_address: 172.28.20.10
      gateway-quarantine-b:
        ipv4_address: 172.28.21.10
      gateway-status: {}
      telemetry: {}
    depends_on:
      edge-b: { condition: service_healthy }
      edge-b-quarantine: { condition: service_started }
      edge-gateway-b-state-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:$${GATEWAY_METRICS_ADDRESS##*:}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 96
    ulimits: { nofile: { soft: 65536, hard: 65536 } }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  edge-gateway-b-state-init:
    logging: *bounded-logging
    image: alpine:3.22.6@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    command: [chown, "10101:10101", /state]
    volumes: [edge-b-gateway-state:/state]
    restart: "no"

  poweradmin:
    logging: *bounded-logging
    image: poweradmin/poweradmin:4.3.3
    ports: ["9191:80"]
    environment:
      DB_TYPE: pgsql
      DB_HOST: pdns-db
      DB_PORT: 5432
      DB_NAME: pdns
      DB_USER: pdns
      DB_PASS: pdns-dev-only
      PA_CREATE_ADMIN: "true"
      PA_ADMIN_USERNAME: ${POWERADMIN_ADMIN_USERNAME:-admin}
      PA_ADMIN_PASSWORD: ${POWERADMIN_ADMIN_PASSWORD:-poweradmin-dev-only}
      PA_ADMIN_EMAIL: admin@example.test
      PA_ADMIN_FULLNAME: CDNFoundry Developer
      DNS_NS1: ns1.cdnf.test
      DNS_NS2: ns2.cdnf.test
      DNS_HOSTMASTER: hostmaster.cdnf.test
    depends_on:
      pdns-db: { condition: service_healthy }
    networks: [dns]
    restart: unless-stopped

  mmdb-updater:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 256m
    build:
      context: ./docker/mmdb-updater
    environment:
      MMDB_PROVIDER: ${MMDB_PROVIDER:-dbip-jsdelivr}
      MMDB_TARGET_FILE: ${MMDB_TARGET_FILE:-GeoLite2-City.mmdb}
      MMDB_DOWNLOAD_INTERVAL_SECONDS: ${MMDB_DOWNLOAD_INTERVAL_SECONDS:-86400}
      MMDB_DOWNLOAD_RETRIES: ${MMDB_DOWNLOAD_RETRIES:-5}
    volumes: [mmdb:/mmdb]
    networks: [telemetry]
    restart: unless-stopped
    healthcheck:
      test: [CMD, test, -s, /mmdb/GeoLite2-City.mmdb]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 90s

networks:
  control: { internal: true }
  # Only core and the two nginx containers; PHP-FPM listens on this network alone.
  fpm:
    internal: true
    ipam: { config: [{ subnet: 172.28.40.0/29 }] }
  ingress: {}
  docker-api: { internal: true }
  dns:
    ipam: { config: [{ subnet: 172.28.30.0/24 }] }
  edge: {}
  gateway-shared-a:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
        - subnet: fd00:cd0f:10::/64
  gateway-quarantine-a:
    internal: true
    ipam: { config: [{ subnet: 172.28.11.0/24 }] }
  gateway-shared-b:
    internal: true
    ipam: { config: [{ subnet: 172.28.20.0/24 }] }
  gateway-quarantine-b:
    internal: true
    ipam: { config: [{ subnet: 172.28.21.0/24 }] }
  gateway-status: { internal: true }
  telemetry: {}

volumes:
  core-vendor: {}
  core-storage: {}
  core-bootstrap-cache: {}
  control-db: {}
  redis: {}
  pdns-db: {}
  pdns-node: {}
  clickhouse: {}
  vector-data: {}
  operational-vector-data: {}
  loki-data: {}
  loki-tools: {}
  prometheus: {}
  grafana-data: {}
  grafana-plugins:
  mmdb: {}
  dev-pki: {}
  edge-a-state: {}
  edge-a-agent-state: {}
  edge-a-gateway-state: {}
  edge-b-state: {}
  edge-b-agent-state: {}
  edge-b-gateway-state: {}
  edge-a-cell-01-cache: {}
  edge-a-cell-02-cache: {}
  edge-a-cell-03-cache: {}
  edge-a-cell-04-cache: {}
  edge-a-cell-05-cache: {}
  edge-a-cell-06-cache: {}
  edge-a-cell-07-cache: {}
  edge-a-cell-08-cache: {}
  edge-b-cell-01-cache: {}
  edge-b-cell-02-cache: {}
  edge-b-cell-03-cache: {}
  edge-b-cell-04-cache: {}
  edge-b-cell-05-cache: {}
  edge-b-cell-06-cache: {}
  edge-b-cell-07-cache: {}
  edge-b-cell-08-cache: {}
