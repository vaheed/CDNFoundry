services:
  caddy:
    ports:
      - "[${PUBLIC_BIND_IPV6:?PUBLIC_BIND_IPV6 is required by the IPv6 override}]:80:80/tcp"
      - "[${PUBLIC_BIND_IPV6:?PUBLIC_BIND_IPV6 is required by the IPv6 override}]:443:443/tcp"
      - "[${PUBLIC_BIND_IPV6:?PUBLIC_BIND_IPV6 is required by the IPv6 override}]:443:443/udp"
