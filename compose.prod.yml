name: cdnfoundry

x-bounded-logging: &bounded-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardened: &hardened
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-core-env: &core-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  EDGE_ARTIFACT_SIGNING_KEY: ${EDGE_ARTIFACT_SIGNING_KEY:?EDGE_ARTIFACT_SIGNING_KEY is required}
  EDGE_ARTIFACT_SIGNING_NEXT_KEY: ${EDGE_ARTIFACT_SIGNING_NEXT_KEY}
  APP_URL: ${APP_URL:?APP_URL is required}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
  DB_CONNECTION: pgsql
  DB_URL: ${DB_URL}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: cdnf
  DB_USERNAME: cdnf
  DB_PASSWORD: ${CONTROL_DB_PASSWORD:?CONTROL_DB_PASSWORD is required}
  DB_SSLMODE: ${DB_SSLMODE}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  REDIS_URL: ${REDIS_URL}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_CACHE_HOST: ${REDIS_CACHE_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_CLIENT: predis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb
  ACME_ENABLED: "true"
  ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL}
  ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
  ACME_ORDER_BUDGET_PER_HOUR: ${ACME_ORDER_BUDGET_PER_HOUR}
  EDGE_IDENTITY_CA_CERTIFICATE: /run/secrets/edge-identity-ca.crt
  EDGE_PROXY_SECRET_FILE: /run/secrets/edge-proxy-secret.conf
  # PHP-FPM listens only on this address of the private fpm network, not on the control network.
  FPM_LISTEN_ALIAS: core-fpm
  EDGE_IDENTITY_CA_PRIVATE_KEY: /run/secrets/edge-identity-ca.key
  EDGE_IDENTITY_CA_PRIVATE_KEY_PASSPHRASE: ${EDGE_IDENTITY_CA_PRIVATE_KEY_PASSPHRASE}
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
  CLICKHOUSE_DATABASE: cdnf
  CLICKHOUSE_USER: cdnf_reader
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?CLICKHOUSE_READER_PASSWORD is required}
  CLICKHOUSE_ZONES_PASSWORD: ${CLICKHOUSE_ZONES_PASSWORD:?CLICKHOUSE_ZONES_PASSWORD is required}
  PROMETHEUS_URL: http://prometheus:9090
  METRICS_TOKEN_FILE: /run/secrets/metrics-token
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
  RESTIC_PASSWORD_FILE: /run/secrets/restic-password
  BACKUP_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID}
  BACKUP_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY}
  BACKUP_DEFAULT_REGION: ${BACKUP_DEFAULT_REGION}
  LOG_CHANNEL: stderr
  LOG_STACK: stderr
  LOG_STDERR_FORMATTER: App\Logging\OperationalJsonFormatter
  GRAFANA_EXPLORE_URL: ${GRAFANA_EXPLORE_URL}
  # Operator tunables. .env.prod holds every value; the template and Fleet write the application defaults.
  ACME_VERIFY_TLS: ${ACME_VERIFY_TLS}
  ACME_RENEW_BEFORE_DAYS: ${ACME_RENEW_BEFORE_DAYS}
  ACME_DNS_TTL: ${ACME_DNS_TTL}
  ACME_DNS_PROBE_SERVER: ${ACME_DNS_PROBE_SERVER}
  ACME_CHALLENGE_LIFETIME_MINUTES: ${ACME_CHALLENGE_LIFETIME_MINUTES}
  ACME_INITIAL_JITTER_SECONDS: ${ACME_INITIAL_JITTER_SECONDS}
  TLS_EXPIRY_ALERT_DAYS: ${TLS_EXPIRY_ALERT_DAYS}
  TLS_UPLOAD_TRUST_FILE: ${TLS_UPLOAD_TRUST_FILE}
  BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY}
  BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY}
  BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY}
  BACKUP_RESTORE_ALLOWED: ${BACKUP_RESTORE_ALLOWED}
  MMDB_STALE_HOURS: ${MMDB_STALE_HOURS}
  VECTOR_METRICS_URL: ${VECTOR_METRICS_URL}
  WAF_RULESET_VERSION: ${WAF_RULESET_VERSION}
  EDGE_IDENTITY_VALIDITY_DAYS: ${EDGE_IDENTITY_VALIDITY_DAYS}
  REDIS_CACHE_PORT: ${REDIS_CACHE_PORT}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL}
  # Optional two-node control plane. Empty on a single node.
  MANAGEMENT_NETWORKS: ${MANAGEMENT_NETWORKS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CONTENT_SECURITY_POLICY: ${CONTENT_SECURITY_POLICY:-enforce}
  CONTROL_NODE_NAME: ${CONTROL_NODE_NAME}
  CONTROL_PEER_ADDRESSES: ${CONTROL_PEER_ADDRESSES}

x-edge-cell: &edge-cell
  logging: *bounded-logging
  <<: *hardened
  cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
  image: ${CDNF_EDGE_RUNTIME_IMAGE:?CDNF_EDGE_RUNTIME_IMAGE must be an immutable image reference}
  profiles: [edge]
  volumes:
    - ${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro
    - ${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro
    - edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro
    - mmdb:/mmdb:ro
  depends_on:
    mmdb-updater: { condition: service_healthy }
  read_only: true
  tmpfs:
    - /var/lib/nginx/tmp:rw,noexec,nosuid,size=64m
    - /usr/local/openresty/nginx/logs:rw,noexec,nosuid,size=16m
  networks: [edge, telemetry]
  restart: unless-stopped
  stop_signal: SIGQUIT
  stop_grace_period: 30s
  mem_limit: 512m
  cpus: 0.5
  pids_limit: 128
  sysctls: { net.ipv4.tcp_syncookies: "1" }
  ulimits:
    nofile: { soft: 32768, hard: 32768 }
  deploy:
    resources:
      limits: { memory: 512m, cpus: "0.5", pids: 128 }
  healthcheck:
    test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 120s

x-core: &core
  <<: *hardened
  # Root only to prepare storage ownership and drop to www-data, so these four capabilities suffice.
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  mem_limit: 1g
  image: ${CDNF_CORE_IMAGE:?CDNF_CORE_IMAGE must be an immutable image reference}
  environment: *core-env
  depends_on:
    control-db: { condition: service_healthy }
    redis: { condition: service_healthy }
    cache: { condition: service_healthy }
    mmdb-updater: { condition: service_healthy }
  networks: [control, telemetry, egress]
  restart: unless-stopped
  stop_grace_period: 60s
  read_only: true
  tmpfs: [/tmp]
  volumes:
    # Runtime storage is initialized by the entrypoint. Disabling Docker's
    # automatic copy-up prevents concurrent control-plane workers from racing
    # while a brand-new shared volume is populated.
    - type: volume
      source: core-storage
      target: /app/storage
      volume:
        nocopy: true
    - mmdb:/mmdb:ro
    - ${EDGE_IDENTITY_CA_CERTIFICATE:?EDGE_IDENTITY_CA_CERTIFICATE is required}:/run/secrets/edge-identity-ca.crt:ro
    - ${EDGE_IDENTITY_CA_PRIVATE_KEY:?EDGE_IDENTITY_CA_PRIVATE_KEY is required}:/run/secrets/edge-identity-ca.key:ro
    - ${EDGE_PROXY_SECRET_FILE:?EDGE_PROXY_SECRET_FILE is required}:/run/secrets/edge-proxy-secret.conf:ro
    - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE is required}:/run/secrets/metrics-token:ro
    - ${RESTIC_PASSWORD_FILE}:/run/secrets/restic-password:ro

services:
  caddy:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: [control]
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      CONTROL_HOSTNAME: ${CONTROL_HOSTNAME:?CONTROL_HOSTNAME is required}
      TELEMETRY_HOSTNAME: ${TELEMETRY_HOSTNAME:?TELEMETRY_HOSTNAME is required}
      GRAFANA_HOSTNAME: ${GRAFANA_HOSTNAME:?GRAFANA_HOSTNAME is required}
      MANAGEMENT_NETWORKS: ${MANAGEMENT_NETWORKS:-0.0.0.0/0 ::/0}
      ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
      EDGE_PUBLIC_IPV4_ALLOWLIST: ${EDGE_PUBLIC_IPV4_ALLOWLIST}
      EDGE_PUBLIC_IPV6_ALLOWLIST: ${EDGE_PUBLIC_IPV6_ALLOWLIST}
      CONTROL_PUBLIC_IPV4_ALLOWLIST: ${CONTROL_PUBLIC_IPV4_ALLOWLIST}
      CONTROL_PUBLIC_IPV6_ALLOWLIST: ${CONTROL_PUBLIC_IPV6_ALLOWLIST}
      LOG_SOURCE_IPV4_ALLOWLIST: ${LOG_SOURCE_IPV4_ALLOWLIST}
      LOG_SOURCE_IPV6_ALLOWLIST: ${LOG_SOURCE_IPV6_ALLOWLIST}
      LOG_AUTH_TOKEN: ${LOG_AUTH_TOKEN:?LOG_AUTH_TOKEN is required}
    ports: ["${HOST_BIND_IPV4}:80:80/tcp", "${HOST_BIND_IPV4}:443:443/tcp", "${HOST_BIND_IPV4}:443:443/udp", "${HOST_BIND_IPV4}:8444:8444/tcp"]
    volumes: [./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: { web: { condition: service_healthy } }
    networks: [ingress, telemetry]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:2019/healthz], interval: 10s, timeout: 3s, retries: 10 }

  telemetry-gateway:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: [telemetry]
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      TELEMETRY_HOSTNAME: ${TELEMETRY_HOSTNAME:?TELEMETRY_HOSTNAME is required}
      GRAFANA_HOSTNAME: ${GRAFANA_HOSTNAME:?GRAFANA_HOSTNAME is required}
      MANAGEMENT_NETWORKS: ${MANAGEMENT_NETWORKS:-0.0.0.0/0 ::/0}
      ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
      EDGE_PUBLIC_IPV4_ALLOWLIST: ${EDGE_PUBLIC_IPV4_ALLOWLIST}
      EDGE_PUBLIC_IPV6_ALLOWLIST: ${EDGE_PUBLIC_IPV6_ALLOWLIST}
      CONTROL_PUBLIC_IPV4_ALLOWLIST: ${CONTROL_PUBLIC_IPV4_ALLOWLIST}
      CONTROL_PUBLIC_IPV6_ALLOWLIST: ${CONTROL_PUBLIC_IPV6_ALLOWLIST}
      LOG_SOURCE_IPV4_ALLOWLIST: ${LOG_SOURCE_IPV4_ALLOWLIST}
      LOG_SOURCE_IPV6_ALLOWLIST: ${LOG_SOURCE_IPV6_ALLOWLIST}
      LOG_AUTH_TOKEN: ${LOG_AUTH_TOKEN:?LOG_AUTH_TOKEN is required}
    ports: ["${HOST_BIND_IPV4}:80:80/tcp", "${HOST_BIND_IPV4}:443:443/tcp", "${HOST_BIND_IPV4}:8444:8444/tcp"]
    volumes: [./deploy/production/Caddyfile.telemetry:/etc/caddy/Caddyfile:ro, telemetry-caddy-data:/data, telemetry-caddy-config:/config]
    depends_on: { clickhouse: { condition: service_healthy }, loki: { condition: service_started }, grafana: { condition: service_healthy } }
    # The gateway must be dual-homed: ingress receives public HTTPS and
    # telemetry keeps ClickHouse, Loki, and Grafana private.
    networks: [ingress, telemetry]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:2019/healthz], interval: 10s, timeout: 3s, retries: 10 }

  core:
    logging: *bounded-logging
    <<: *core
    profiles: [control]
    networks:
      control: {}
      telemetry: {}
      egress: {}
      fpm: { aliases: [core-fpm] }
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('core-fpm', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 256m
    image: ${CDNF_WEB_IMAGE:?CDNF_WEB_IMAGE must be an immutable image reference}
    profiles: [control]
    ports: ["${CONTROL_BIND}:8080"]
    depends_on:
      core: { condition: service_healthy }
    networks: [control, fpm, ingress]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 10

  edge-control:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 256m
    image: ${CDNF_EDGE_CONTROL_IMAGE:?CDNF_EDGE_CONTROL_IMAGE must be an immutable image reference}
    profiles: [control]
    ports: ["${EDGE_CONTROL_BIND}:8443"]
    volumes:
      - ${EDGE_CONTROL_SERVER_CERTIFICATE:?EDGE_CONTROL_SERVER_CERTIFICATE is required}:/run/secrets/edge-control-server.crt:ro
      - ${EDGE_CONTROL_SERVER_PRIVATE_KEY:?EDGE_CONTROL_SERVER_PRIVATE_KEY is required}:/run/secrets/edge-control-server.key:ro
      - ${EDGE_IDENTITY_CA_CERTIFICATE:?EDGE_IDENTITY_CA_CERTIFICATE is required}:/run/secrets/edge-identity-ca.crt:ro
      - ${EDGE_PROXY_SECRET_FILE:?EDGE_PROXY_SECRET_FILE is required}:/run/secrets/edge-proxy-secret.conf:ro
    depends_on:
      core: { condition: service_healthy }
    networks: [fpm, ingress]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    healthcheck:
      test: [CMD-SHELL, "wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  horizon:
    logging: *bounded-logging
    <<: *core
    profiles: [control]
    # The start guard refuses a standby, a replica, and a node that a higher epoch replaced.
    command: [sh, -c, "php artisan cdnf:control:guard && exec php artisan horizon"]
    stop_grace_period: 120s
    healthcheck:
      test: [CMD-SHELL, "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scheduler:
    logging: *bounded-logging
    <<: *core
    profiles: [control]
    command: [sh, -c, "php artisan cdnf:control:guard && exec php artisan schedule:work"]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, php, artisan, cdnf:scheduler:check]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  migrate:
    logging: *bounded-logging
    <<: *core
    profiles: [tools]
    command: [php, artisan, migrate, --force]
    # The deployment workflow starts and health-checks control-db and redis
    # explicitly before this one-shot tool. A cross-profile depends_on makes
    # the tools profile invalid on DNS-only hosts.
    depends_on: {}
    restart: "no"

  control-db:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 2g
    image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    profiles: [control]
    environment:
      POSTGRES_DB: cdnf
      POSTGRES_USER: cdnf
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
    volumes: [control-db:/var/lib/postgresql]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cdnf -d cdnf"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1280m
    image: valkey/valkey:9.1.2-alpine3.24@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    profiles: [control]
    # Queues, sessions, and locks: persistent, and never evicted. The password comes from a mounted
    # configuration file, so it is not on the command line or in `docker inspect`.
    command: [valkey-server, /run/secrets/valkey.conf, --appendonly, "yes", --maxmemory, 1gb, --maxmemory-policy, noeviction]
    volumes: [redis:/data, "${VALKEY_CONFIG_FILE:?VALKEY_CONFIG_FILE is required}:/run/secrets/valkey.conf:ro"]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /run/secrets/valkey.conf) valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  cache:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 768m
    image: valkey/valkey:9.1.2-alpine3.24@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    profiles: [control]
    # Application cache only: rebuildable, not persisted, and evicted least-recently-used when full.
    command: [valkey-server, /run/secrets/valkey.conf, --save, "", --appendonly, "no", --maxmemory, 512mb, --maxmemory-policy, allkeys-lru]
    volumes: ["${VALKEY_CONFIG_FILE:?VALKEY_CONFIG_FILE is required}:/run/secrets/valkey.conf:ro"]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /run/secrets/valkey.conf) valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-db:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1g
    image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    profiles: [control]
    environment:
      POSTGRES_DB: pdns
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: ${PDNS_DB_PASSWORD:?PDNS_DB_PASSWORD is required}
    volumes:
      - pdns-db:/var/lib/postgresql
      - ./docker/postgres/pdns-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/postgres/ensure-pdns-runtime.sh:/usr/local/bin/ensure-pdns-runtime.sh:ro
    networks: [dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pdns -d pdns"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The hidden primary. Laravel writes zones here through the API on the private control network;
  # DNS nodes pull them over TSIG-signed transfers on port 5300 and never call in. Publish 5300 only
  # as far as the node addresses need to reach it.
  pdns-primary:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 512m
    image: powerdns/pdns-auth-51:5.1.4@sha256:bb5b1c133bcca1dd455075321de7d55db4945a8d7f2ba23339e3c7bbe416b205
    entrypoint: [/usr/local/bin/pdns-production-start]
    command: [--disable-syslog, --daemon=no, --guardian=no]
    init: true
    profiles: [control]
    environment:
      PDNS_DB_PASSWORD: ${PDNS_DB_PASSWORD:?PDNS_DB_PASSWORD is required}
      PDNS_API_KEY: ${PDNS_API_KEY:?PDNS_API_KEY is required}
    ports:
      - "${HOST_BIND_IPV4}:5300:5300/tcp"
      - "${HOST_BIND_IPV4}:5300:5300/udp"
    volumes:
      - ./docker/pdns/primary.conf:/etc/powerdns/pdns.conf:ro
      - ./docker/pdns/production-start.sh:/usr/local/bin/pdns-production-start:ro
    depends_on:
      pdns-db: { condition: service_healthy }
    # The API is reachable only through control and dns-private; ingress carries the published
    # transfer port.
    networks: [ingress, control, dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, pdns_control, rping]
      interval: 5s
      timeout: 3s
      retries: 20

  # A DNS node: a PowerDNS secondary that serves the zones the hidden primary hands it. Its SQLite
  # store is a cache the primary can rebuild; the PoP agent configures it through the local API.
  pdns-auth:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 512m
    image: powerdns/pdns-auth-51:5.1.4@sha256:bb5b1c133bcca1dd455075321de7d55db4945a8d7f2ba23339e3c7bbe416b205
    entrypoint: [/usr/local/bin/pdns-production-start]
    command: [--disable-syslog, --daemon=no, --guardian=no]
    init: true
    profiles: [dns]
    environment:
      PDNS_API_KEY: ${PDNS_API_KEY:?PDNS_API_KEY is required}
    volumes:
      - ./docker/pdns/pdns.conf:/etc/powerdns/pdns.conf:ro
      - ./docker/pdns/production-start.sh:/usr/local/bin/pdns-production-start:ro
      - ./docker/pdns/geoip-zones.yml:/etc/powerdns/geoip-zones.yml:ro
      - pdns-node:/var/lib/powerdns
      - mmdb:/mmdb:ro
    depends_on:
      mmdb-updater: { condition: service_healthy }
    # The agent reaches the local API on dns-private; DNSdist reaches the DNS port there too. Egress lets it pull zones from the
    # primary (dns-private is internal, so without it every transfer fails with "Network is unreachable"). It publishes no port.
    networks: [dns-private, egress]
    restart: unless-stopped
    healthcheck:
      test: [CMD, pdns_control, rping]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-migrate:
    logging: *bounded-logging
    <<: *hardened
    mem_limit: 128m
    image: postgres:18.6-alpine3.24@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    profiles: [tools]
    command: [psql, -v, ON_ERROR_STOP=1, -h, pdns-db, -U, pdns, -d, pdns, -f, /migrations/2026_07_17_000001_add_powerdns_metadata_tables.sql]
    environment: { PGPASSWORD: "${PDNS_DB_PASSWORD}" }
    volumes: [./docker/postgres/pdns-migrations:/migrations:ro]
    # The deployment workflow starts and health-checks pdns-db explicitly.
    # Keep this tool valid when the same base file is used on control hosts.
    networks: [dns-private]
    restart: "no"

  dnsdist:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 512m
    image: powerdns/dnsdist-21:2.1.2@sha256:efabf173811e27438bebee5f1f40e047f263ea39093a8f7d6097df494cf1ed67
    entrypoint: [/usr/local/bin/dnsdist]
    command: [--supervised, --disable-syslog]
    init: true
    profiles: [dns]
    ports:
      - "${DNS_BIND_V4}:53:53/udp"
      - "${DNS_BIND_V4}:53:53/tcp"
    volumes: [./docker/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro]
    depends_on:
      pdns-auth: { condition: service_healthy }
    # Authoritative queries arrive through ingress; the PowerDNS backend stays
    # reachable only through the internal dns-private network.
    networks: [ingress, dns-private]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8083/metrics', timeout=2).read(1)"]
      interval: 10s
      timeout: 3s
      retries: 10

