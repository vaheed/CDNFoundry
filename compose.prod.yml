    volumes: [edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-03-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-04:
    logging: *bounded-logging
    <<: *edge-cell
    ports: ["127.0.0.1:18084:8081", "127.0.0.1:18447:8444", "127.0.0.1:19084:9080"]
    environment: { EDGE_CELL_NAME: cell-04, EDGE_PROXY_PROTOCOL_TRUSTED_CIDRS: "${EDGE_NETWORK_SUBNET:?EDGE_NETWORK_SUBNET is required}", EDGE_REQUIRE_MEMORY_TLS: "true", EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-04.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb, GEOIP_ASN_DATABASE: /mmdb/GeoLite2-ASN.mmdb }
    volumes: [edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-04-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-05:
    logging: *bounded-logging
    <<: *edge-cell
    ports: ["127.0.0.1:18085:8081", "127.0.0.1:18448:8444", "127.0.0.1:19085:9080"]
    environment: { EDGE_CELL_NAME: cell-05, EDGE_PROXY_PROTOCOL_TRUSTED_CIDRS: "${EDGE_NETWORK_SUBNET:?EDGE_NETWORK_SUBNET is required}", EDGE_REQUIRE_MEMORY_TLS: "true", EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-05.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb, GEOIP_ASN_DATABASE: /mmdb/GeoLite2-ASN.mmdb }
    volumes: [edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-05-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-06:
    logging: *bounded-logging
    <<: *edge-cell
    ports: ["127.0.0.1:18086:8081", "127.0.0.1:18449:8444", "127.0.0.1:19086:9080"]
    environment: { EDGE_CELL_NAME: cell-06, EDGE_PROXY_PROTOCOL_TRUSTED_CIDRS: "${EDGE_NETWORK_SUBNET:?EDGE_NETWORK_SUBNET is required}", EDGE_REQUIRE_MEMORY_TLS: "true", EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-06.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb, GEOIP_ASN_DATABASE: /mmdb/GeoLite2-ASN.mmdb }
    volumes: [edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-06-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-07:
    logging: *bounded-logging
    <<: *edge-cell
    ports: ["127.0.0.1:18087:8081", "127.0.0.1:18450:8444", "127.0.0.1:19087:9080"]
    environment: { EDGE_CELL_NAME: cell-07, EDGE_PROXY_PROTOCOL_TRUSTED_CIDRS: "${EDGE_NETWORK_SUBNET:?EDGE_NETWORK_SUBNET is required}", EDGE_REQUIRE_MEMORY_TLS: "true", EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-07.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb, GEOIP_ASN_DATABASE: /mmdb/GeoLite2-ASN.mmdb }
    volumes: [edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-07-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-08:
    logging: *bounded-logging
    <<: *edge-cell
    ports: ["127.0.0.1:18088:8081", "127.0.0.1:18451:8444", "127.0.0.1:19088:9080"]
    environment: { EDGE_CELL_NAME: cell-08, EDGE_PROXY_PROTOCOL_TRUSTED_CIDRS: "${EDGE_NETWORK_SUBNET:?EDGE_NETWORK_SUBNET is required}", EDGE_REQUIRE_MEMORY_TLS: "true", EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-08.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb, GEOIP_ASN_DATABASE: /mmdb/GeoLite2-ASN.mmdb }
    volumes: [edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-08-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  edge-agent:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    image: ${CDNF_EDGE_AGENT_IMAGE:?CDNF_EDGE_AGENT_IMAGE must be an immutable image reference}
    profiles: [edge]
    environment:
      EDGE_CONTROL_URL: ${EDGE_CONTROL_URL:?EDGE_CONTROL_URL is required}
      EDGE_CONTROL_CA_CERTIFICATE: /run/secrets/edge-control-ca.crt
      EDGE_ID: ${EDGE_ID}
      EDGE_BOOTSTRAP_TOKEN: ${EDGE_BOOTSTRAP_TOKEN}
      EDGE_STATE_DIR: /var/lib/cdnfoundry/agent
      EDGE_RUNTIME_DIR: /var/lib/cdnfoundry/runtime
      EDGE_STATE_ENCRYPTION_KEY_FILE: /run/secrets/edge-state-encryption.key
      EDGE_GATEWAY_STATUS_URL: ${EDGE_GATEWAY_STATUS_URL}
      EDGE_GATEWAY_ADDRESS_MAP: ${EDGE_GATEWAY_ADDRESS_MAP}
      EDGE_GATEWAY_REQUIRE_ADDRESS_MAP: ${EDGE_GATEWAY_REQUIRE_ADDRESS_MAP}
      EDGE_RUNTIME_VERSIONS: ${EDGE_RUNTIME_VERSIONS}
      EDGE_CELL_ASSIGNMENTS: '{"cell-01":"shared-default","cell-02":"quarantine-default","cell-03":"","cell-04":"","cell-05":"","cell-06":"","cell-07":"","cell-08":""}'
      EDGE_CELL_STATUS_URLS: http://cell-01:9080/passive-failures,http://cell-02:9080/passive-failures,http://cell-03:9080/passive-failures,http://cell-04:9080/passive-failures,http://cell-05:9080/passive-failures,http://cell-06:9080/passive-failures,http://cell-07:9080/passive-failures,http://cell-08:9080/passive-failures
      EDGE_STATUS_TOKEN: ${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}
      # Set only on a PoP that also runs a DNS node: the agent drives that node's local PowerDNS API.
      EDGE_DNS_API_URL: ${EDGE_DNS_API_URL}
      EDGE_DNS_API_KEY: ${EDGE_DNS_API_KEY}
    volumes:
      - edge-agent-state:/var/lib/cdnfoundry/agent
      - edge-runtime-memory:/var/lib/cdnfoundry/runtime
      - ${EDGE_STATE_ENCRYPTION_KEY_FILE:?EDGE_STATE_ENCRYPTION_KEY_FILE is required}:/run/secrets/edge-state-encryption.key:ro
      - ${EDGE_CONTROL_CA_CERTIFICATE:?EDGE_CONTROL_CA_CERTIFICATE is required}:/run/secrets/edge-control-ca.crt:ro
    networks:
      edge:
        aliases: [edge-agent]
      dns-private: {}
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [CMD, /usr/local/bin/edge-agent, --healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
          pids: 64

  edge-gateway:
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]
    image: ${CDNF_EDGE_GATEWAY_IMAGE:?CDNF_EDGE_GATEWAY_IMAGE must be an immutable image reference}
    profiles: [edge]
    environment:
      GATEWAY_CONFIG_FILE: /var/lib/cdnfoundry/runtime/current/gateway.json
      GATEWAY_STATE_DIR: /var/lib/cdnfoundry/gateway-state
      GATEWAY_METRICS_ADDRESS: ${EDGE_GATEWAY_METRICS_ADDRESS}
      GATEWAY_MAX_CONNECTIONS: ${EDGE_GATEWAY_MAX_CONNECTIONS}
      GATEWAY_MAX_CONNECTIONS_PER_ADDRESS: ${EDGE_GATEWAY_MAX_CONNECTIONS_PER_ADDRESS}
      GATEWAY_IDLE_TIMEOUT_SECONDS: ${EDGE_GATEWAY_IDLE_TIMEOUT_SECONDS}
      GATEWAY_HALF_CLOSE_TIMEOUT_SECONDS: ${EDGE_GATEWAY_HALF_CLOSE_TIMEOUT_SECONDS}
    volumes:
      - edge-runtime-memory:/var/lib/cdnfoundry/runtime:ro
      - edge-gateway-state:/var/lib/cdnfoundry/gateway-state
    network_mode: host
    depends_on:
      edge-gateway-state-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:$${GATEWAY_METRICS_ADDRESS##*:}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
          pids: 128

  edge-gateway-state-init:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 64m
    image: alpine:3.22.6@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    profiles: [edge]
    command: [chown, "10101:10101", /state]
    volumes: [edge-gateway-state:/state]
    restart: "no"

  mmdb-updater:
    logging: *bounded-logging
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 256m
    image: ${CDNF_MMDB_UPDATER_IMAGE:?CDNF_MMDB_UPDATER_IMAGE must be an immutable image reference}
    profiles: [control, dns, edge]
    environment:
      MMDB_PROVIDER: ${MMDB_PROVIDER}
      MMDB_TARGET_FILE: ${MMDB_TARGET_FILE}
      MMDB_DOWNLOAD_INTERVAL_SECONDS: ${MMDB_DOWNLOAD_INTERVAL_SECONDS}
      MMDB_DOWNLOAD_RETRIES: ${MMDB_DOWNLOAD_RETRIES}
      MMDB_EXPECTED_SHA256: ${MMDB_EXPECTED_SHA256}
      MMDB_CHECKSUM_URL: ${MMDB_CHECKSUM_URL}
      MMDB_REQUIRE_VERIFICATION: "true"
      MMDB_DOWNLOAD_URL: ${MMDB_DOWNLOAD_URL}
      MMDB_DOWNLOAD_HEADER: ${MMDB_DOWNLOAD_HEADER}
      MMDB_ASN_DOWNLOAD_URL: ${MMDB_ASN_DOWNLOAD_URL}
      MMDB_ASN_EXPECTED_SHA256: ${MMDB_ASN_EXPECTED_SHA256}
      MMDB_ASN_CHECKSUM_URL: ${MMDB_ASN_CHECKSUM_URL}
    volumes: [mmdb:/mmdb]
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: [CMD, test, -s, /mmdb/GeoLite2-City.mmdb]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 90s

networks:
  control: { internal: true }
  # Only core and the two nginx containers. PHP-FPM listens on this network alone.
  fpm:
    internal: true
    ipam:
      config:
        - subnet: ${FPM_NETWORK_SUBNET:?FPM_NETWORK_SUBNET is required}
  ingress: {}
  dns-private: { internal: true }
  telemetry: { internal: true }
  # Between the log collector and its read-only Docker API proxy; nothing else joins.
  docker-api: { internal: true }
  # Cells trust PROXY protocol headers only from this network, which holds the
  # cells and carries the gateway's connections. Override the default if it
  # collides with a host network.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_NETWORK_SUBNET:?EDGE_NETWORK_SUBNET is required}
  egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  telemetry-caddy-data: {}
  telemetry-caddy-config: {}
  core-storage: {}
  control-db: {}
  redis: {}
  pdns-db: {}
  pdns-node: {}
  clickhouse: {}
  vector-data: {}
  operational-vector-data: {}
  loki-data: {}
  loki-tools: {}
  prometheus: {}
  grafana-data: {}
  grafana-plugins:
  edge-runtime-memory:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,uid=10101,gid=10101,mode=0700,nosuid,nodev,noexec
  edge-agent-state: {}
  edge-gateway-state: {}
  mmdb: {}
  cell-01-cache: {}
  cell-02-cache: {}
  cell-03-cache: {}
  cell-04-cache: {}
  cell-05-cache: {}
  cell-06-cache: {}
  cell-07-cache: {}
  cell-08-cache: {}
