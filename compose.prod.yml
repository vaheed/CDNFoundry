      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1", pids: 128 }

  docker-socket-proxy:
    logging: *bounded-logging
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    profiles: [logs]
    environment:
      # Container listing, logs, and events are all the log collector reads. Everything else is refused.
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      SECRETS: "0"
      SERVICES: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped
    tmpfs: [/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 15s
      timeout: 3s
      retries: 5

  log-collector:
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]
    image: timberio/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
    profiles: [logs]
    command: [--config, /etc/vector/operational.yaml]
    environment:
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      LOG_ENVIRONMENT: production
      LOG_ROLE: ${LOG_ROLE:?LOG_ROLE is required for the logs profile}
      LOG_HOST: ${LOG_HOST:?LOG_HOST is required for the logs profile}
      LOG_COLLECTOR_ID: ${LOG_COLLECTOR_ID:?LOG_COLLECTOR_ID is required for the logs profile}
      LOG_BUFFER_BYTES: ${LOG_BUFFER_BYTES}
      LOG_METRICS_ADDRESS: 0.0.0.0:9599
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:?LOKI_ENDPOINT is required for the logs profile}
      LOG_AUTH_TOKEN: ${LOG_AUTH_TOKEN:?LOG_AUTH_TOKEN is required for the logs profile}
    volumes:
      - ./docker/vector/operational.yaml:/etc/vector/operational.yaml:ro
      - operational-vector-data:/vector-data-dir
    ports: ["${LOG_METRICS_BIND}:9599"]
    depends_on:
