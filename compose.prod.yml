name: cdnfoundry

x-core-env: &core-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  EDGE_ARTIFACT_SIGNING_KEY: ${EDGE_ARTIFACT_SIGNING_KEY:?EDGE_ARTIFACT_SIGNING_KEY is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  DB_CONNECTION: pgsql
  DB_URL: ${DB_URL:-}
  DB_HOST: ${DB_HOST:-control-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: cdnf
  DB_USERNAME: cdnf
  DB_PASSWORD: ${CONTROL_DB_PASSWORD:?CONTROL_DB_PASSWORD is required}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  REDIS_URL: ${REDIS_URL:-}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_CLIENT: predis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb
  ACME_ENABLED: "true"
  ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
  ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
  ACME_ORDER_BUDGET_PER_HOUR: ${ACME_ORDER_BUDGET_PER_HOUR:-20}
  EDGE_IDENTITY_CA_CERTIFICATE: /run/secrets/edge-identity-ca.crt
  EDGE_IDENTITY_CA_PRIVATE_KEY: /run/secrets/edge-identity-ca.key
  EDGE_IDENTITY_CA_PRIVATE_KEY_PASSPHRASE: ${EDGE_IDENTITY_CA_PRIVATE_KEY_PASSPHRASE:-}
  PDNS_CA_CERTIFICATE: /run/secrets/pdns-api-ca.crt
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
  CLICKHOUSE_DATABASE: cdnf
  CLICKHOUSE_USER: cdnf
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
  PROMETHEUS_URL: http://prometheus:9090
  METRICS_TOKEN_FILE: /run/secrets/metrics-token
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?RESTIC_REPOSITORY is required}
  RESTIC_PASSWORD_FILE: /run/secrets/restic-password
  BACKUP_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:?BACKUP_ACCESS_KEY_ID is required}
  BACKUP_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:?BACKUP_SECRET_ACCESS_KEY is required}
  BACKUP_DEFAULT_REGION: ${BACKUP_DEFAULT_REGION:-us-east-1}

x-edge-cell: &edge-cell
  image: ghcr.io/vaheed/cdnfoundry-edge-runtime:${CDNF_RELEASE:?CDNF_RELEASE must be a published commit SHA or release tag}
  profiles: [edge]
  volumes:
    - ${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro
    - ${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro
    - edge-state:/var/lib/cdnfoundry/runtime:ro
    - mmdb:/mmdb:ro
  depends_on:
    mmdb-updater: { condition: service_healthy }
  read_only: true
  tmpfs:
    - /var/lib/nginx/tmp:rw,noexec,nosuid,size=64m
    - /usr/local/openresty/nginx/logs:rw,noexec,nosuid,size=16m
  networks: [edge, telemetry]
  restart: unless-stopped
  stop_signal: SIGQUIT
  stop_grace_period: 30s
  mem_limit: 512m
  cpus: 0.5
  pids_limit: 128
  sysctls: { net.ipv4.tcp_syncookies: "1" }
  ulimits:
    nofile: { soft: 32768, hard: 32768 }
  deploy:
    resources:
      limits: { memory: 512m, cpus: "0.5", pids: 128 }

x-core: &core
  image: ghcr.io/vaheed/cdnfoundry-core:${CDNF_RELEASE:?CDNF_RELEASE must be a published commit SHA or release tag}
  environment: *core-env
  depends_on:
    control-db: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [control, telemetry, egress]
  restart: unless-stopped
  stop_grace_period: 60s
  read_only: true
  tmpfs: [/tmp]
  volumes:
    # Runtime storage is initialized by the entrypoint. Disabling Docker's
    # automatic copy-up prevents concurrent control-plane workers from racing
    # while a brand-new shared volume is populated.
    - type: volume
      source: core-storage
      target: /app/storage
      volume:
        nocopy: true
    - mmdb:/mmdb:ro
    - ${EDGE_IDENTITY_CA_CERTIFICATE:?EDGE_IDENTITY_CA_CERTIFICATE is required}:/run/secrets/edge-identity-ca.crt:ro
    - ${EDGE_IDENTITY_CA_PRIVATE_KEY:?EDGE_IDENTITY_CA_PRIVATE_KEY is required}:/run/secrets/edge-identity-ca.key:ro
    - ${PDNS_CA_CERTIFICATE:?PDNS_CA_CERTIFICATE is required}:/run/secrets/pdns-api-ca.crt:ro
    - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE is required}:/run/secrets/metrics-token:ro
    - ${RESTIC_PASSWORD_FILE:?RESTIC_PASSWORD_FILE is required}:/run/secrets/restic-password:ro

services:
  core:
    <<: *core
    profiles: [control]
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/vaheed/cdnfoundry-web:${CDNF_RELEASE:?CDNF_RELEASE must be a published commit SHA or release tag}
    profiles: [control]
    ports: ["${CONTROL_BIND:-127.0.0.1:8080}:8080"]
    depends_on:
      core: { condition: service_healthy }
    networks: [control, ingress]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 10

  edge-control:
    image: ghcr.io/vaheed/cdnfoundry-edge-control:${CDNF_RELEASE:?CDNF_RELEASE must be a published commit SHA or release tag}
    profiles: [control]
    ports: ["${EDGE_CONTROL_BIND:-0.0.0.0:8443}:8443"]
    volumes:
      - ${EDGE_CONTROL_SERVER_CERTIFICATE:?EDGE_CONTROL_SERVER_CERTIFICATE is required}:/run/secrets/edge-control-server.crt:ro
      - ${EDGE_CONTROL_SERVER_PRIVATE_KEY:?EDGE_CONTROL_SERVER_PRIVATE_KEY is required}:/run/secrets/edge-control-server.key:ro
      - ${EDGE_IDENTITY_CA_CERTIFICATE:?EDGE_IDENTITY_CA_CERTIFICATE is required}:/run/secrets/edge-identity-ca.crt:ro
    depends_on:
      core: { condition: service_healthy }
    networks: [control, ingress]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]

  horizon:
    <<: *core
    profiles: [control]
    command: [php, artisan, horizon]
    stop_grace_period: 120s

  scheduler:
    <<: *core
    profiles: [control]
    command: [php, artisan, schedule:work]
    stop_grace_period: 30s

  migrate:
    <<: *core
    profiles: [tools]
    command: [php, artisan, migrate, --force]
    restart: "no"

  control-db:
    image: postgres:18.4-alpine
    profiles: [control]
    environment:
      POSTGRES_DB: cdnf
      POSTGRES_USER: cdnf
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
    volumes: [control-db:/var/lib/postgresql]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cdnf -d cdnf"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:9.1.0-alpine
    profiles: [control]
    command: [valkey-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}", --maxmemory, 1gb, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "valkey-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-db:
    image: postgres:18.4-alpine
    profiles: [dns]
    environment:
      POSTGRES_DB: pdns
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: ${PDNS_DB_PASSWORD:?PDNS_DB_PASSWORD is required}
    volumes:
      - pdns-db:/var/lib/postgresql
      - ./docker/postgres/pdns-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pdns -d pdns"]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-auth:
    image: powerdns/pdns-auth-51:5.1.3
    profiles: [dns]
    environment:
      PDNS_gpgsql_password: ${PDNS_DB_PASSWORD}
      PDNS_api_key: ${PDNS_API_KEY:?PDNS_API_KEY is required}
    volumes:
      - ./docker/pdns/pdns.conf:/etc/powerdns/pdns.conf:ro
      - ./docker/pdns/geoip-zones.yml:/etc/powerdns/geoip-zones.yml:ro
      - mmdb:/mmdb:ro
    depends_on:
      pdns-db: { condition: service_healthy }
      mmdb-updater: { condition: service_healthy }
    networks: [dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, pdns_control, rping]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-migrate:
    image: postgres:18.4-alpine
    profiles: [tools]
    command: [psql, -v, ON_ERROR_STOP=1, -h, pdns-db, -U, pdns, -d, pdns, -f, /migrations/2026_07_17_000001_add_powerdns_metadata_tables.sql]
    environment: { PGPASSWORD: "${PDNS_DB_PASSWORD}" }
    volumes: [./docker/postgres/pdns-migrations:/migrations:ro]
    depends_on:
      pdns-db: { condition: service_healthy }
    networks: [dns-private]
    restart: "no"

  dnsdist:
    image: powerdns/dnsdist-21:2.1.0
    profiles: [dns]
    ports:
      - "${DNS_BIND_V4:-0.0.0.0}:53:53/udp"
      - "${DNS_BIND_V4:-0.0.0.0}:53:53/tcp"
    volumes: [./docker/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro]
    depends_on:
      pdns-auth: { condition: service_healthy }
    networks: [dns-private]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8083/metrics', timeout=2).read(1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.12.3-alpine
    profiles: [telemetry]
    environment:
      CLICKHOUSE_DB: cdnf
      CLICKHOUSE_USER: cdnf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [telemetry]
    restart: unless-stopped

  vector:
    image: timberio/vector:0.55.0-alpine
    profiles: [telemetry, edge]
    environment:
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
      CLICKHOUSE_USER: cdnf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - ./docker/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/vector-data-dir
    networks: [telemetry, edge, dns-private]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: [telemetry]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/telemetry-alerts.yml:/etc/prometheus/telemetry-alerts.yml:ro
      - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE is required}:/run/secrets/metrics-token:ro
      - prometheus:/prometheus
    networks: [telemetry, control, dns-private]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.10.2
    profiles: [telemetry]
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/host/root, --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [telemetry]
    read_only: true
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1
    profiles: [telemetry]
    volumes: [./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    networks: [telemetry]
    restart: unless-stopped

  cell-01: &cell-01
    <<: *edge-cell
    ports: ["127.0.0.1:18081:8081", "127.0.0.1:18444:8444", "127.0.0.1:19081:9080"]
    environment: { EDGE_CELL_NAME: cell-01, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-01.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes:
      - ${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro
      - ${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro
      - edge-state:/var/lib/cdnfoundry/runtime:ro
      - mmdb:/mmdb:ro
      - cell-01-cache:/var/cache/nginx
    networks:
      edge: { aliases: [edge] }
      telemetry: {}

  cell-02:
    <<: *edge-cell
    ports: ["127.0.0.1:18082:8081", "127.0.0.1:18445:8444", "127.0.0.1:19082:9080"]
    environment: { EDGE_CELL_NAME: cell-02, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-02.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes:
      - ${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro
      - ${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro
      - edge-state:/var/lib/cdnfoundry/runtime:ro
      - mmdb:/mmdb:ro
      - cell-02-cache:/var/cache/nginx
    networks:
      edge: { aliases: [edge-quarantine] }
      telemetry: {}

  cell-03:
    <<: *edge-cell
    ports: ["127.0.0.1:18083:8081", "127.0.0.1:18446:8444", "127.0.0.1:19083:9080"]
    environment: { EDGE_CELL_NAME: cell-03, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-03.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-03-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-04:
    <<: *edge-cell
    ports: ["127.0.0.1:18084:8081", "127.0.0.1:18447:8444", "127.0.0.1:19084:9080"]
    environment: { EDGE_CELL_NAME: cell-04, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-04.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-04-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-05:
    <<: *edge-cell
    ports: ["127.0.0.1:18085:8081", "127.0.0.1:18448:8444", "127.0.0.1:19085:9080"]
    environment: { EDGE_CELL_NAME: cell-05, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-05.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-05-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-06:
    <<: *edge-cell
    ports: ["127.0.0.1:18086:8081", "127.0.0.1:18449:8444", "127.0.0.1:19086:9080"]
    environment: { EDGE_CELL_NAME: cell-06, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-06.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-06-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-07:
    <<: *edge-cell
    ports: ["127.0.0.1:18087:8081", "127.0.0.1:18450:8444", "127.0.0.1:19087:9080"]
    environment: { EDGE_CELL_NAME: cell-07, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-07.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-07-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-08:
    <<: *edge-cell
    ports: ["127.0.0.1:18088:8081", "127.0.0.1:18451:8444", "127.0.0.1:19088:9080"]
    environment: { EDGE_CELL_NAME: cell-08, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/cell-08.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-08-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  edge-agent:
    image: ghcr.io/vaheed/cdnfoundry-edge-agent:${CDNF_RELEASE:?CDNF_RELEASE must be a published commit SHA or release tag}
    profiles: [edge]
    environment:
      EDGE_CONTROL_URL: ${EDGE_CONTROL_URL:?EDGE_CONTROL_URL is required}
      EDGE_CONTROL_CA_CERTIFICATE: /run/secrets/edge-control-ca.crt
      EDGE_ID: ${EDGE_ID:-}
      EDGE_BOOTSTRAP_TOKEN: ${EDGE_BOOTSTRAP_TOKEN:-}
      EDGE_STATE_DIR: /var/lib/cdnfoundry/agent
      EDGE_RUNTIME_DIR: /var/lib/cdnfoundry/runtime
      EDGE_GATEWAY_STATUS_URL: ${EDGE_GATEWAY_STATUS_URL:-http://host-gateway:9105/metrics}
      EDGE_RUNTIME_VERSIONS: ${EDGE_RUNTIME_VERSIONS:-{}}
      EDGE_CELL_ASSIGNMENTS: '{"cell-01":"shared-default","cell-02":"quarantine-default","cell-03":"","cell-04":"","cell-05":"","cell-06":"","cell-07":"","cell-08":""}'
      EDGE_CELL_STATUS_URLS: http://cell-01:9080/passive-failures,http://cell-02:9080/passive-failures,http://cell-03:9080/passive-failures,http://cell-04:9080/passive-failures,http://cell-05:9080/passive-failures,http://cell-06:9080/passive-failures,http://cell-07:9080/passive-failures,http://cell-08:9080/passive-failures
      EDGE_STATUS_TOKEN: ${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}
    volumes:
      - edge-agent-state:/var/lib/cdnfoundry/agent
      - edge-state:/var/lib/cdnfoundry/runtime
      - ${EDGE_CONTROL_CA_CERTIFICATE:?EDGE_CONTROL_CA_CERTIFICATE is required}:/run/secrets/edge-control-ca.crt:ro
    networks:
      edge:
        aliases: [edge-agent]
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 64

  edge-gateway:
    image: ghcr.io/vaheed/cdnfoundry-edge-gateway:${CDNF_RELEASE:?CDNF_RELEASE must be a published commit SHA or release tag}
    profiles: [edge]
    environment:
      GATEWAY_CONFIG_FILE: /var/lib/cdnfoundry/runtime/gateway.json
      GATEWAY_STATE_DIR: /var/lib/cdnfoundry/gateway-state
      GATEWAY_METRICS_ADDRESS: ${EDGE_GATEWAY_METRICS_ADDRESS:-0.0.0.0:9105}
      GATEWAY_MAX_CONNECTIONS: ${EDGE_GATEWAY_MAX_CONNECTIONS:-8192}
    volumes:
      - edge-state:/var/lib/cdnfoundry/runtime:ro
      - edge-gateway-state:/var/lib/cdnfoundry/gateway-state
    network_mode: host
    depends_on:
      edge-gateway-state-init: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
          pids: 128

  edge-gateway-state-init:
    image: alpine:3.22
    profiles: [edge]
    command: [chown, "10101:10101", /state]
    volumes: [edge-gateway-state:/state]
    restart: "no"

  mmdb-updater:
    image: ghcr.io/vaheed/cdnfoundry-mmdb-updater:${CDNF_RELEASE:?CDNF_RELEASE must be a published commit SHA or release tag}
    profiles: [dns, edge]
    environment:
      MMDB_PROVIDER: ${MMDB_PROVIDER:-dbip-jsdelivr}
      MMDB_TARGET_FILE: ${MMDB_TARGET_FILE:-GeoLite2-City.mmdb}
      MMDB_DOWNLOAD_INTERVAL_SECONDS: ${MMDB_DOWNLOAD_INTERVAL_SECONDS:-86400}
      MMDB_DOWNLOAD_RETRIES: ${MMDB_DOWNLOAD_RETRIES:-5}
      MMDB_EXPECTED_SHA256: ${MMDB_EXPECTED_SHA256:-}
      MMDB_DOWNLOAD_URL: ${MMDB_DOWNLOAD_URL:-}
      MMDB_DOWNLOAD_HEADER: ${MMDB_DOWNLOAD_HEADER:-}
    volumes: [mmdb:/mmdb]
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: [CMD, test, -s, /mmdb/GeoLite2-City.mmdb]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 90s

networks:
  control: { internal: true }
  ingress: {}
  dns-private: { internal: true }
  telemetry: { internal: true }
  edge: {}
  egress: {}

volumes:
  core-storage: {}
  control-db: {}
  redis: {}
  pdns-db: {}
  clickhouse: {}
  vector-data: {}
  prometheus: {}
  edge-state: {}
  edge-agent-state: {}
  edge-gateway-state: {}
  mmdb: {}
  cell-01-cache: {}
  cell-02-cache: {}
  cell-03-cache: {}
  cell-04-cache: {}
  cell-05-cache: {}
  cell-06-cache: {}
  cell-07-cache: {}
  cell-08-cache: {}
