    networks: [telemetry, egress, docker-api]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 96
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.25", pids: 96 }
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9599"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

