      - ./docker/prometheus/traffic-alerts.yml:/etc/prometheus/traffic-alerts.yml:ro
      - ./docker/prometheus/security-alerts.yml:/etc/prometheus/security-alerts.yml:ro
      - ./docker/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - ./docker/prometheus/dashboard-rules.yml:/etc/prometheus/dashboard-rules.yml:ro
      - ${PROMETHEUS_PROBE_TARGETS_FILE}:/etc/prometheus/probe-targets.yml:ro
      - ${PROMETHEUS_VECTOR_TARGETS_FILE}:/etc/prometheus/vector-targets.yml:ro
      - ${PROMETHEUS_CONTROL_TARGETS_FILE}:/etc/prometheus/control-targets.yml:ro
      - ${PROMETHEUS_NODE_TARGETS_FILE}:/etc/prometheus/node-targets.yml:ro
      - ${PROMETHEUS_DNS_TARGETS_FILE}:/etc/prometheus/dns-targets.yml:ro
      - ${PROMETHEUS_EDGE_TARGETS_FILE}:/etc/prometheus/edge-targets.yml:ro
      - ${PROMETHEUS_LOG_TARGETS_FILE}:/etc/prometheus/operational-log-targets.yml:ro
      - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE is required}:/run/secrets/metrics-token:ro
      - prometheus:/prometheus
    networks: [telemetry, control, dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana-plugins-init:
