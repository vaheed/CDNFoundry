      - if [ -f /plugins/grafana-clickhouse-datasource/plugin.json ]; then echo present; exit 0; fi; wget -qO /tmp/plugin.zip 'https://grafana.com/api/plugins/grafana-clickhouse-datasource/versions/4.21.3/download?os=linux&arch=amd64' && echo '53c0602214e7ca1af1733962779293587386b0b9a8c544ecead80b819e5f560b  /tmp/plugin.zip' | sha256sum -c - && unzip -q /tmp/plugin.zip -d /plugins && rm /tmp/plugin.zip
    volumes: [grafana-plugins:/plugins]
