name: cdnfoundry

x-core-env: &core-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  EDGE_ARTIFACT_SIGNING_KEY: ${EDGE_ARTIFACT_SIGNING_KEY:?EDGE_ARTIFACT_SIGNING_KEY is required}
  APP_URL: ${APP_URL:?APP_URL is required}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
  DB_CONNECTION: pgsql
  DB_URL: ${DB_URL}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: cdnf
  DB_USERNAME: cdnf
  DB_PASSWORD: ${CONTROL_DB_PASSWORD:?CONTROL_DB_PASSWORD is required}
  DB_SSLMODE: ${DB_SSLMODE}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  REDIS_URL: ${REDIS_URL}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_CLIENT: predis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb
  ACME_ENABLED: "true"
  ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL}
  ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
  ACME_ORDER_BUDGET_PER_HOUR: ${ACME_ORDER_BUDGET_PER_HOUR}
  EDGE_IDENTITY_CA_CERTIFICATE: /run/secrets/edge-identity-ca.crt
  EDGE_IDENTITY_CA_PRIVATE_KEY: /run/secrets/edge-identity-ca.key
  EDGE_IDENTITY_CA_PRIVATE_KEY_PASSPHRASE: ${EDGE_IDENTITY_CA_PRIVATE_KEY_PASSPHRASE}
  PDNS_CA_CERTIFICATE: /run/secrets/pdns-api-ca.crt
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
  CLICKHOUSE_DATABASE: cdnf
  CLICKHOUSE_USER: cdnf
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
  PROMETHEUS_URL: http://prometheus:9090
  METRICS_TOKEN_FILE: /run/secrets/metrics-token
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
  RESTIC_PASSWORD_FILE: /run/secrets/restic-password
  BACKUP_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID}
  BACKUP_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY}
  BACKUP_DEFAULT_REGION: ${BACKUP_DEFAULT_REGION}
  LOG_CHANNEL: stderr
  LOG_STACK: stderr
  LOG_STDERR_FORMATTER: App\Logging\OperationalJsonFormatter
  GRAFANA_EXPLORE_URL: ${GRAFANA_EXPLORE_URL}

x-edge-cell: &edge-cell
  image: ${CDNF_EDGE_RUNTIME_IMAGE:?CDNF_EDGE_RUNTIME_IMAGE must be an immutable image reference}
  profiles: [edge]
  volumes:
    - ${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro
    - ${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro
    - edge-state:/var/lib/cdnfoundry/runtime:ro
    - mmdb:/mmdb:ro
  depends_on:
    mmdb-updater: { condition: service_healthy }
  read_only: true
  tmpfs:
    - /var/lib/nginx/tmp:rw,noexec,nosuid,size=64m
    - /usr/local/openresty/nginx/logs:rw,noexec,nosuid,size=16m
  networks: [edge, telemetry]
  restart: unless-stopped
  stop_signal: SIGQUIT
  stop_grace_period: 30s
  mem_limit: 512m
  cpus: 0.5
  pids_limit: 128
  sysctls: { net.ipv4.tcp_syncookies: "1" }
  ulimits:
    nofile: { soft: 32768, hard: 32768 }
  deploy:
    resources:
      limits: { memory: 512m, cpus: "0.5", pids: 128 }

x-core: &core
  image: ${CDNF_CORE_IMAGE:?CDNF_CORE_IMAGE must be an immutable image reference}
  environment: *core-env
  depends_on:
    control-db: { condition: service_healthy }
    redis: { condition: service_healthy }
    mmdb-updater: { condition: service_healthy }
  networks: [control, telemetry, egress]
  restart: unless-stopped
  stop_grace_period: 60s
  read_only: true
  tmpfs: [/tmp]
  volumes:
    # Runtime storage is initialized by the entrypoint. Disabling Docker's
    # automatic copy-up prevents concurrent control-plane workers from racing
    # while a brand-new shared volume is populated.
    - type: volume
      source: core-storage
      target: /app/storage
      volume:
        nocopy: true
    - mmdb:/mmdb:ro
    - ${EDGE_IDENTITY_CA_CERTIFICATE:?EDGE_IDENTITY_CA_CERTIFICATE is required}:/run/secrets/edge-identity-ca.crt:ro
    - ${EDGE_IDENTITY_CA_PRIVATE_KEY:?EDGE_IDENTITY_CA_PRIVATE_KEY is required}:/run/secrets/edge-identity-ca.key:ro
    - ${PDNS_CA_CERTIFICATE:?PDNS_CA_CERTIFICATE is required}:/run/secrets/pdns-api-ca.crt:ro
    - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE is required}:/run/secrets/metrics-token:ro
    - ${RESTIC_PASSWORD_FILE}:/run/secrets/restic-password:ro

services:
  caddy:
    image: caddy:2.11.4-alpine
    profiles: [control]
    environment:
      CONTROL_HOSTNAME: ${CONTROL_HOSTNAME:?CONTROL_HOSTNAME is required}
      TELEMETRY_HOSTNAME: ${TELEMETRY_HOSTNAME:?TELEMETRY_HOSTNAME is required}
      GRAFANA_HOSTNAME: ${GRAFANA_HOSTNAME:?GRAFANA_HOSTNAME is required}
      ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
      EDGE_PUBLIC_IPV4_ALLOWLIST: ${EDGE_PUBLIC_IPV4_ALLOWLIST}
      EDGE_PUBLIC_IPV6_ALLOWLIST: ${EDGE_PUBLIC_IPV6_ALLOWLIST}
      CONTROL_PUBLIC_IPV4_ALLOWLIST: ${CONTROL_PUBLIC_IPV4_ALLOWLIST}
      CONTROL_PUBLIC_IPV6_ALLOWLIST: ${CONTROL_PUBLIC_IPV6_ALLOWLIST}
      LOG_SOURCE_IPV4_ALLOWLIST: ${LOG_SOURCE_IPV4_ALLOWLIST}
      LOG_SOURCE_IPV6_ALLOWLIST: ${LOG_SOURCE_IPV6_ALLOWLIST}
      LOG_AUTH_TOKEN: ${LOG_AUTH_TOKEN:?LOG_AUTH_TOKEN is required}
    ports: ["${HOST_BIND_IPV4}:80:80/tcp", "${HOST_BIND_IPV4}:443:443/tcp", "${HOST_BIND_IPV4}:443:443/udp", "${HOST_BIND_IPV4}:8444:8444/tcp"]
    volumes: [./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: { web: { condition: service_healthy } }
    networks: [ingress, telemetry]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:2019/healthz], interval: 10s, timeout: 3s, retries: 10 }

  dns-api:
    image: caddy:2.11.4-alpine
    profiles: [dns]
    environment:
      DNS_API_HOSTNAME: ${DNS_API_HOSTNAME:?DNS_API_HOSTNAME is required}
      CONTROL_PUBLIC_IPV4_ALLOWLIST: ${CONTROL_PUBLIC_IPV4_ALLOWLIST}
      CONTROL_PUBLIC_IPV6_ALLOWLIST: ${CONTROL_PUBLIC_IPV6_ALLOWLIST}
    ports: ["${HOST_BIND_IPV4}:8444:8444/tcp"]
    volumes: [./deploy/production/Caddyfile.dns-api:/etc/caddy/Caddyfile:ro, "${DNS_API_SERVER_CERTIFICATE:?required}:/run/secrets/dns-api.crt:ro", "${DNS_API_SERVER_PRIVATE_KEY:?required}:/run/secrets/dns-api.key:ro", dns-api-caddy-data:/data, dns-api-caddy-config:/config]
    depends_on: { pdns-auth: { condition: service_healthy } }
    networks: [dns-private]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:2019/healthz], interval: 10s, timeout: 3s, retries: 10 }

  telemetry-gateway:
    image: caddy:2.11.4-alpine
    profiles: [telemetry]
    environment:
      TELEMETRY_HOSTNAME: ${TELEMETRY_HOSTNAME:?TELEMETRY_HOSTNAME is required}
      GRAFANA_HOSTNAME: ${GRAFANA_HOSTNAME:?GRAFANA_HOSTNAME is required}
      ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
      EDGE_PUBLIC_IPV4_ALLOWLIST: ${EDGE_PUBLIC_IPV4_ALLOWLIST}
      EDGE_PUBLIC_IPV6_ALLOWLIST: ${EDGE_PUBLIC_IPV6_ALLOWLIST}
      CONTROL_PUBLIC_IPV4_ALLOWLIST: ${CONTROL_PUBLIC_IPV4_ALLOWLIST}
      CONTROL_PUBLIC_IPV6_ALLOWLIST: ${CONTROL_PUBLIC_IPV6_ALLOWLIST}
      LOG_SOURCE_IPV4_ALLOWLIST: ${LOG_SOURCE_IPV4_ALLOWLIST}
      LOG_SOURCE_IPV6_ALLOWLIST: ${LOG_SOURCE_IPV6_ALLOWLIST}
      LOG_AUTH_TOKEN: ${LOG_AUTH_TOKEN:?LOG_AUTH_TOKEN is required}
    ports: ["${HOST_BIND_IPV4}:80:80/tcp", "${HOST_BIND_IPV4}:443:443/tcp", "${HOST_BIND_IPV4}:8444:8444/tcp"]
    volumes: [./deploy/production/Caddyfile.telemetry:/etc/caddy/Caddyfile:ro, telemetry-caddy-data:/data, telemetry-caddy-config:/config]
    depends_on: { clickhouse: { condition: service_healthy }, loki: { condition: service_healthy }, grafana: { condition: service_healthy } }
    networks: [telemetry]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:2019/healthz], interval: 10s, timeout: 3s, retries: 10 }

  core:
    <<: *core
    profiles: [control]
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ${CDNF_WEB_IMAGE:?CDNF_WEB_IMAGE must be an immutable image reference}
    profiles: [control]
    ports: ["${CONTROL_BIND}:8080"]
    depends_on:
      core: { condition: service_healthy }
    networks: [control, ingress]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 10

  edge-control:
    image: ${CDNF_EDGE_CONTROL_IMAGE:?CDNF_EDGE_CONTROL_IMAGE must be an immutable image reference}
    profiles: [control]
    ports: ["${EDGE_CONTROL_BIND}:8443"]
    volumes:
      - ${EDGE_CONTROL_SERVER_CERTIFICATE:?EDGE_CONTROL_SERVER_CERTIFICATE is required}:/run/secrets/edge-control-server.crt:ro
      - ${EDGE_CONTROL_SERVER_PRIVATE_KEY:?EDGE_CONTROL_SERVER_PRIVATE_KEY is required}:/run/secrets/edge-control-server.key:ro
      - ${EDGE_IDENTITY_CA_CERTIFICATE:?EDGE_IDENTITY_CA_CERTIFICATE is required}:/run/secrets/edge-identity-ca.crt:ro
    depends_on:
      core: { condition: service_healthy }
    networks: [control, ingress]
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]

  horizon:
    <<: *core
    profiles: [control]
    command: [php, artisan, horizon]
    stop_grace_period: 120s

  scheduler:
    <<: *core
    profiles: [control]
    command: [php, artisan, schedule:work]
    stop_grace_period: 30s

  migrate:
    <<: *core
    profiles: [tools]
    command: [php, artisan, migrate, --force]
    # The deployment workflow starts and health-checks control-db and redis
    # explicitly before this one-shot tool. A cross-profile depends_on makes
    # the tools profile invalid on DNS-only hosts.
    depends_on: {}
    restart: "no"

  control-db:
    image: postgres:18.4-alpine
    profiles: [control]
    environment:
      POSTGRES_DB: cdnf
      POSTGRES_USER: cdnf
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
    volumes: [control-db:/var/lib/postgresql]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cdnf -d cdnf"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:9.1.0-alpine
    profiles: [control]
    command: [valkey-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}", --maxmemory, 1gb, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "valkey-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-db:
    image: postgres:18.4-alpine
    profiles: [dns]
    environment:
      POSTGRES_DB: pdns
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: ${PDNS_DB_PASSWORD:?PDNS_DB_PASSWORD is required}
    volumes:
      - pdns-db:/var/lib/postgresql
      - ./docker/postgres/pdns-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pdns -d pdns"]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-auth:
    image: powerdns/pdns-auth-51:5.1.3
    profiles: [dns]
    environment:
      PDNS_gpgsql_password: ${PDNS_DB_PASSWORD}
      PDNS_api_key: ${PDNS_API_KEY:?PDNS_API_KEY is required}
    volumes:
      - ./docker/pdns/pdns.conf:/etc/powerdns/pdns.conf:ro
      - ./docker/pdns/geoip-zones.yml:/etc/powerdns/geoip-zones.yml:ro
      - mmdb:/mmdb:ro
    depends_on:
      pdns-db: { condition: service_healthy }
      mmdb-updater: { condition: service_healthy }
    networks: [dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, pdns_control, rping]
      interval: 5s
      timeout: 3s
      retries: 20

  pdns-migrate:
    image: postgres:18.4-alpine
    profiles: [tools]
    command: [psql, -v, ON_ERROR_STOP=1, -h, pdns-db, -U, pdns, -d, pdns, -f, /migrations/2026_07_17_000001_add_powerdns_metadata_tables.sql]
    environment: { PGPASSWORD: "${PDNS_DB_PASSWORD}" }
    volumes: [./docker/postgres/pdns-migrations:/migrations:ro]
    # The deployment workflow starts and health-checks pdns-db explicitly.
    # Keep this tool valid when the same base file is used on control hosts.
    networks: [dns-private]
    restart: "no"

  dnsdist:
    image: powerdns/dnsdist-21:2.1.0
    profiles: [dns]
    ports:
      - "${DNS_BIND_V4}:53:53/udp"
      - "${DNS_BIND_V4}:53:53/tcp"
    volumes: [./docker/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro]
    depends_on:
      pdns-auth: { condition: service_healthy }
    networks: [dns-private]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8083/metrics', timeout=2).read(1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.12.3-alpine
    profiles: [telemetry]
    environment:
      CLICKHOUSE_DB: cdnf
      CLICKHOUSE_USER: cdnf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      GRAFANA_CLICKHOUSE_PASSWORD: ${GRAFANA_CLICKHOUSE_PASSWORD:?GRAFANA_CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./docker/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./docker/clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
    networks: [telemetry]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user cdnf --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  vector:
    image: timberio/vector:0.55.0-alpine
    profiles: [telemetry, dns, edge]
    environment:
      CLICKHOUSE_ENDPOINT: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
      CLICKHOUSE_USER: cdnf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - ./docker/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/vector-data-dir
    networks: [telemetry, edge, dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, vector, validate, --no-environment, /etc/vector/vector.yaml]
      interval: 30s
      timeout: 10s
      retries: 3

  loki-data-init:
    image: alpine:3.22
    profiles: [telemetry]
    command: [chown, "10001:10001", /loki]
    volumes: [loki-data:/loki]
    restart: "no"

  loki:
    image: ${CDNF_LOKI_IMAGE:?CDNF_LOKI_IMAGE must be an immutable image reference}
    profiles: [telemetry]
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD}
      LOKI_MAX_QUERY_LENGTH: ${LOKI_MAX_QUERY_LENGTH}
    volumes: [loki-data:/loki]
    depends_on:
      loki-data-init: { condition: service_completed_successfully }
    networks: [telemetry]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, /usr/local/bin/busybox, wget, -qO-, http://127.0.0.1:3100/ready]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1", pids: 128 }

  log-collector:
    image: timberio/vector:0.55.0-debian@sha256:a4be1111b40303524aae2ffb02cd59cef2a4e9753bd13d265bf0233e921828d9
    profiles: [logs]
    command: [--config, /etc/vector/operational.yaml]
    environment:
      LOG_ENVIRONMENT: production
      LOG_ROLE: ${LOG_ROLE:?LOG_ROLE is required for the logs profile}
      LOG_HOST: ${LOG_HOST:?LOG_HOST is required for the logs profile}
      LOG_COLLECTOR_ID: ${LOG_COLLECTOR_ID:?LOG_COLLECTOR_ID is required for the logs profile}
      LOG_BUFFER_BYTES: ${LOG_BUFFER_BYTES}
      LOG_METRICS_ADDRESS: 0.0.0.0:9599
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:?LOKI_ENDPOINT is required for the logs profile}
      LOG_AUTH_TOKEN: ${LOG_AUTH_TOKEN:?LOG_AUTH_TOKEN is required for the logs profile}
    volumes:
      - ./docker/vector/operational.yaml:/etc/vector/operational.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - operational-vector-data:/vector-data-dir
    ports: ["${LOG_METRICS_BIND}:9599"]
    networks: [telemetry, egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 96
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.25", pids: 96 }

  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: [telemetry]
    group_add: ["82"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/telemetry-alerts.yml:/etc/prometheus/telemetry-alerts.yml:ro
      - ${PROMETHEUS_CONTROL_TARGETS_FILE}:/etc/prometheus/control-targets.yml:ro
      - ${PROMETHEUS_NODE_TARGETS_FILE}:/etc/prometheus/node-targets.yml:ro
      - ${PROMETHEUS_DNS_TARGETS_FILE}:/etc/prometheus/dns-targets.yml:ro
      - ${PROMETHEUS_EDGE_TARGETS_FILE}:/etc/prometheus/edge-targets.yml:ro
      - ${PROMETHEUS_LOG_TARGETS_FILE}:/etc/prometheus/operational-log-targets.yml:ro
      - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE is required}:/run/secrets/metrics-token:ro
      - prometheus:/prometheus
    networks: [telemetry, control, dns-private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana-control-db-provision:
    image: postgres:18.4-alpine
    profiles: [telemetry]
    environment:
      PGHOST: ${GRAFANA_POSTGRES_PROVISION_HOST}
      PGPORT: ${GRAFANA_POSTGRES_PROVISION_PORT}
      PGDATABASE: cdnf
      PGUSER: cdnf
      PGPASSWORD: ${CONTROL_DB_PASSWORD:?CONTROL_DB_PASSWORD is required}
      PGSSLMODE: ${DB_SSLMODE}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:?GRAFANA_POSTGRES_PASSWORD is required}
    volumes:
      - ./docker/grafana/postgres:/provision:ro
    command: [sh, /provision/provision.sh]
    networks: [control, egress]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32

  grafana:
    image: ${CDNF_GRAFANA_IMAGE:?CDNF_GRAFANA_IMAGE must be an immutable image reference}
    profiles: [telemetry]
    ports: ["${GRAFANA_BIND}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_FILTERS: dashboard-service:warn
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE}
      GF_PATHS_PLUGINS: /usr/share/grafana/cdnfoundry-plugins
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-command-center.json
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_CLICKHOUSE_HOST: ${GRAFANA_CLICKHOUSE_HOST}
      GRAFANA_CLICKHOUSE_PORT: ${GRAFANA_CLICKHOUSE_PORT}
      GRAFANA_CLICKHOUSE_PROTOCOL: ${GRAFANA_CLICKHOUSE_PROTOCOL}
      GRAFANA_CLICKHOUSE_SECURE: ${GRAFANA_CLICKHOUSE_SECURE}
      GRAFANA_CLICKHOUSE_USER: ${GRAFANA_CLICKHOUSE_USER}
      GRAFANA_CLICKHOUSE_PASSWORD: ${GRAFANA_CLICKHOUSE_PASSWORD:?GRAFANA_CLICKHOUSE_PASSWORD is required}
      GRAFANA_POSTGRES_HOST: ${GRAFANA_POSTGRES_HOST}
      GRAFANA_POSTGRES_PORT: ${GRAFANA_POSTGRES_PORT}
      GRAFANA_POSTGRES_DATABASE: ${GRAFANA_POSTGRES_DATABASE}
      GRAFANA_POSTGRES_USER: ${GRAFANA_POSTGRES_USER}
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD:?GRAFANA_POSTGRES_PASSWORD is required}
      GRAFANA_POSTGRES_SSLMODE: ${GRAFANA_POSTGRES_SSLMODE}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse: { condition: service_healthy }
      grafana-control-db-provision: { condition: service_completed_successfully }
      prometheus: { condition: service_healthy }
    networks: [telemetry, control, egress]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/log/grafana:rw,noexec,nosuid,size=16m
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    deploy:
      resources:
        limits: { memory: 512m, cpus: "0.5", pids: 128 }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 20

  node-exporter:
    image: prom/node-exporter:v1.10.2
    profiles: [control, dns, edge, telemetry]
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/host/root, --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [telemetry, egress]
    read_only: true
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1
    profiles: [telemetry]
    volumes: [./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    networks: [telemetry]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9093/-/ready]
      interval: 10s
      timeout: 3s
      retries: 20

  cell-01: &cell-01
    <<: *edge-cell
    ports: ["127.0.0.1:18081:8081", "127.0.0.1:18444:8444", "127.0.0.1:19081:9080"]
    environment: { EDGE_CELL_NAME: cell-01, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-01.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes:
      - ${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro
      - ${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro
      - edge-state:/var/lib/cdnfoundry/runtime:ro
      - mmdb:/mmdb:ro
      - cell-01-cache:/var/cache/nginx
    networks:
      edge: { aliases: [edge] }
      telemetry: {}

  cell-02:
    <<: *edge-cell
    ports: ["127.0.0.1:18082:8081", "127.0.0.1:18445:8444", "127.0.0.1:19082:9080"]
    environment: { EDGE_CELL_NAME: cell-02, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-02.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes:
      - ${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro
      - ${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro
      - edge-state:/var/lib/cdnfoundry/runtime:ro
      - mmdb:/mmdb:ro
      - cell-02-cache:/var/cache/nginx
    networks:
      edge: { aliases: [edge-quarantine] }
      telemetry: {}

  cell-03:
    <<: *edge-cell
    ports: ["127.0.0.1:18083:8081", "127.0.0.1:18446:8444", "127.0.0.1:19083:9080"]
    environment: { EDGE_CELL_NAME: cell-03, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-03.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-03-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-04:
    <<: *edge-cell
    ports: ["127.0.0.1:18084:8081", "127.0.0.1:18447:8444", "127.0.0.1:19084:9080"]
    environment: { EDGE_CELL_NAME: cell-04, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-04.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-04-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-05:
    <<: *edge-cell
    ports: ["127.0.0.1:18085:8081", "127.0.0.1:18448:8444", "127.0.0.1:19085:9080"]
    environment: { EDGE_CELL_NAME: cell-05, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-05.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-05-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-06:
    <<: *edge-cell
    ports: ["127.0.0.1:18086:8081", "127.0.0.1:18449:8444", "127.0.0.1:19086:9080"]
    environment: { EDGE_CELL_NAME: cell-06, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-06.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-06-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-07:
    <<: *edge-cell
    ports: ["127.0.0.1:18087:8081", "127.0.0.1:18450:8444", "127.0.0.1:19087:9080"]
    environment: { EDGE_CELL_NAME: cell-07, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-07.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-07-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  cell-08:
    <<: *edge-cell
    ports: ["127.0.0.1:18088:8081", "127.0.0.1:18451:8444", "127.0.0.1:19088:9080"]
    environment: { EDGE_CELL_NAME: cell-08, EDGE_RUNTIME_FILE: /var/lib/cdnfoundry/runtime/current/cell-08.json, EDGE_STATUS_TOKEN: "${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}", GEOIP_DATABASE: /mmdb/GeoLite2-City.mmdb }
    volumes: [edge-state:/var/lib/cdnfoundry/runtime:ro, mmdb:/mmdb:ro, cell-08-cache:/var/cache/nginx, "${EDGE_RUNTIME_TLS_CERTIFICATE:?EDGE_RUNTIME_TLS_CERTIFICATE is required}:/run/edge/tls.crt:ro", "${EDGE_RUNTIME_TLS_PRIVATE_KEY:?EDGE_RUNTIME_TLS_PRIVATE_KEY is required}:/run/edge/tls.key:ro"]

  edge-agent:
    image: ${CDNF_EDGE_AGENT_IMAGE:?CDNF_EDGE_AGENT_IMAGE must be an immutable image reference}
    profiles: [edge]
    environment:
      EDGE_CONTROL_URL: ${EDGE_CONTROL_URL:?EDGE_CONTROL_URL is required}
      EDGE_CONTROL_CA_CERTIFICATE: /run/secrets/edge-control-ca.crt
      EDGE_ID: ${EDGE_ID}
      EDGE_BOOTSTRAP_TOKEN: ${EDGE_BOOTSTRAP_TOKEN}
      EDGE_STATE_DIR: /var/lib/cdnfoundry/agent
      EDGE_RUNTIME_DIR: /var/lib/cdnfoundry/runtime
      EDGE_GATEWAY_STATUS_URL: ${EDGE_GATEWAY_STATUS_URL}
      EDGE_GATEWAY_ADDRESS_MAP: ${EDGE_GATEWAY_ADDRESS_MAP}
      EDGE_GATEWAY_REQUIRE_ADDRESS_MAP: "true"
      EDGE_RUNTIME_VERSIONS: ${EDGE_RUNTIME_VERSIONS}
      EDGE_CELL_ASSIGNMENTS: '{"cell-01":"shared-default","cell-02":"quarantine-default","cell-03":"","cell-04":"","cell-05":"","cell-06":"","cell-07":"","cell-08":""}'
      EDGE_CELL_STATUS_URLS: http://cell-01:9080/passive-failures,http://cell-02:9080/passive-failures,http://cell-03:9080/passive-failures,http://cell-04:9080/passive-failures,http://cell-05:9080/passive-failures,http://cell-06:9080/passive-failures,http://cell-07:9080/passive-failures,http://cell-08:9080/passive-failures
      EDGE_STATUS_TOKEN: ${EDGE_STATUS_TOKEN:?EDGE_STATUS_TOKEN is required}
    volumes:
      - edge-agent-state:/var/lib/cdnfoundry/agent
      - edge-state:/var/lib/cdnfoundry/runtime
      - ${EDGE_CONTROL_CA_CERTIFICATE:?EDGE_CONTROL_CA_CERTIFICATE is required}:/run/secrets/edge-control-ca.crt:ro
    networks:
      edge:
        aliases: [edge-agent]
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 64

  edge-gateway:
    image: ${CDNF_EDGE_GATEWAY_IMAGE:?CDNF_EDGE_GATEWAY_IMAGE must be an immutable image reference}
    profiles: [edge]
    environment:
      GATEWAY_CONFIG_FILE: /var/lib/cdnfoundry/runtime/current/gateway.json
      GATEWAY_STATE_DIR: /var/lib/cdnfoundry/gateway-state
      GATEWAY_METRICS_ADDRESS: ${EDGE_GATEWAY_METRICS_ADDRESS}
      GATEWAY_MAX_CONNECTIONS: ${EDGE_GATEWAY_MAX_CONNECTIONS}
    volumes:
      - edge-state:/var/lib/cdnfoundry/runtime:ro
      - edge-gateway-state:/var/lib/cdnfoundry/gateway-state
    network_mode: host
    depends_on:
      edge-gateway-state-init: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
          pids: 128

  edge-gateway-state-init:
    image: alpine:3.22
    profiles: [edge]
    command: [chown, "10101:10101", /state]
    volumes: [edge-gateway-state:/state]
    restart: "no"

  mmdb-updater:
    image: ${CDNF_MMDB_UPDATER_IMAGE:?CDNF_MMDB_UPDATER_IMAGE must be an immutable image reference}
    profiles: [control, dns, edge]
    environment:
      MMDB_PROVIDER: ${MMDB_PROVIDER}
      MMDB_TARGET_FILE: ${MMDB_TARGET_FILE}
      MMDB_DOWNLOAD_INTERVAL_SECONDS: ${MMDB_DOWNLOAD_INTERVAL_SECONDS}
      MMDB_DOWNLOAD_RETRIES: ${MMDB_DOWNLOAD_RETRIES}
      MMDB_EXPECTED_SHA256: ${MMDB_EXPECTED_SHA256}
      MMDB_DOWNLOAD_URL: ${MMDB_DOWNLOAD_URL}
      MMDB_DOWNLOAD_HEADER: ${MMDB_DOWNLOAD_HEADER}
    volumes: [mmdb:/mmdb]
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: [CMD, test, -s, /mmdb/GeoLite2-City.mmdb]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 90s

networks:
  control: { internal: true }
  ingress: {}
  dns-private: { internal: true }
  telemetry: { internal: true }
  edge: {}
  egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  dns-api-caddy-data: {}
  dns-api-caddy-config: {}
  telemetry-caddy-data: {}
  telemetry-caddy-config: {}
  core-storage: {}
  control-db: {}
  redis: {}
  pdns-db: {}
  clickhouse: {}
  vector-data: {}
  operational-vector-data: {}
  loki-data: {}
  prometheus: {}
  grafana-data: {}
  edge-state: {}
  edge-agent-state: {}
  edge-gateway-state: {}
  mmdb: {}
  cell-01-cache: {}
  cell-02-cache: {}
  cell-03-cache: {}
  cell-04-cache: {}
  cell-05-cache: {}
  cell-06-cache: {}
  cell-07-cache: {}
  cell-08-cache: {}
