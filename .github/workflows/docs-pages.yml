name: Documentation website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'docs/**'
      - 'tests/docs/**'
      - 'Makefile'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  DOCS_SITE_URL: https://vaheed.github.io/CDNFoundry
  DOCS_BASE: /CDNFoundry/

jobs:
  build:
    name: Validate and build VitePress
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install documentation dependencies
        run: npm ci --prefix docs
      - name: Audit documentation dependencies
        run: npm audit --prefix docs --audit-level=high
      - name: Validate and build documentation
        run: make docs-check
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy VitePress to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
