name: CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: PHP, contracts, and assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, intl
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install PHP dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if composer install --no-interaction --no-progress --prefer-install=auto; then
              exit 0
            fi
            if (( attempt == 5 )); then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Validate PHP dependency contract and advisories
        run: composer validate --strict && composer audit --locked --no-interaction
      - name: Install frontend dependencies
        run: npm ci
      - name: Check production frontend dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Build frontend assets
        run: npm run build
      - name: Run application tests
        run: php artisan test
      - name: Qualify isolated PostgreSQL domain claim concurrency
        working-directory: .
        run: python3 tests/e2e/postgres_domain_claims.py
      - name: Qualify isolated PostgreSQL edge task receipts
        working-directory: .
        run: python3 tests/e2e/postgres_edge_tasks.py
      - name: Qualify signed parent delegation with real BIND
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y bind9-dnsutils
          python3 tests/e2e/parent_delegation.py
      - name: Check OpenAPI contract
        run: php artisan cdnf:api:openapi --check

  images:
    name: Build production images (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        group: [application, edge, dashboards, authoritative-dns, dns-routing, monitoring, agents, logging, storage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable runner space for source image builds
        run: bash scripts/prepare-image-runner.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Set reproducible release labels and per-image caches
        env:
          IMAGE_GROUP: ${{ matrix.group }}
        run: |
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          python3 scripts/ci/images.py cache "$IMAGE_GROUP"
      - name: Build and cache this image group
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          SOURCE_REVISION: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          source: .
          files: |
            docker-bake.hcl
            storage/ci-images/cache.json
          targets: ${{ matrix.group }}
          load: true
          provenance: false
      - name: Export exact images for qualification and publication
        env:
          IMAGE_GROUP: ${{ matrix.group }}
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/ci/images.py export "$IMAGE_GROUP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-images-${{ matrix.group }}
          path: |
            storage/ci-images/*.tar.gz
            storage/ci-images/*.manifest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  compose:
    name: Compose contracts and production images
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable runner space for source image builds
        run: bash scripts/prepare-image-runner.sh
      - name: Install Fleet and DNS qualification dependencies
        run: |
          python3 -m pip install -r tests/fleet/requirements.txt
          sudo apt-get update
          sudo apt-get install -y bind9-dnsutils
      - name: Qualify Fleet configuration and generated bundles
        run: make fleet-test
      - name: Enforce software supply-chain policy and negative fixtures
        run: make supply-chain-check
      - name: Verify exact vulnerability classification boundaries and expiry
        run: python3 tests/e2e/trivy_classifications.py
      - name: Validate development topology
        run: docker compose -f compose.dev.yml config --quiet
      - name: Validate production topology
        run: docker compose --env-file .env.prod.example -f compose.prod.yml config --quiet
      - name: Validate production role overrides
        run: ./scripts/validate-production-overrides.sh
      - name: Validate observability contracts
        run: python3 -m unittest tests/observability/test_grafana_contract.py tests/observability/test_operational_logging_contract.py
      - name: Validate Python syntax
        run: python3 -m compileall -q tests/e2e tests/docs tests/fleet tests/qualification tests/supply_chain scripts/cdnfoundry_fleet scripts/ci
      - name: Download exact production images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: production-images-*
          path: storage/ci-images
          merge-multiple: true
      - name: Load and verify production image identities
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/ci/images.py load
      - name: Scan every built release image before allowing publication
        run: python3 scripts/supply-chain-policy.py --scan-release-images ci --output storage/qualification/release-image-scans
      - name: Retain complete release image scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-image-scans
          path: |
            storage/qualification/release-image-scans/*.json
            storage/qualification/release-image-scans/*.txt
      - name: Validate operational logging configurations and alert rules
        run: |
          docker run --rm \
            -e VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true \
            -e LOG_ENVIRONMENT=testing -e LOG_ROLE=test -e LOG_HOST=test-host \
            -e LOG_COLLECTOR_ID=test-01 -e LOG_BUFFER_BYTES=268435488 \
            -e LOG_METRICS_ADDRESS=127.0.0.1:9599 -e LOKI_ENDPOINT=http://127.0.0.1:3100 \
            -e LOG_AUTH_TOKEN=test-only-bearer-token \
            -v "$PWD/docker/vector/operational.yaml:/etc/vector/operational.yaml:ro" \
            -v "$PWD/docker/vector/host-journal.yaml:/etc/vector/host-journal.yaml:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /tmp:/vector-data-dir \
            ghcr.io/vaheed/cdnfoundry-vector:ci \
            validate --skip-healthchecks /etc/vector/operational.yaml /etc/vector/host-journal.yaml
          docker run --rm \
            -e VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true \
            -e LOG_ENVIRONMENT=testing -e LOG_ROLE=test -e LOG_HOST=test-host \
            -e LOG_COLLECTOR_ID=test-01 -e LOG_BUFFER_BYTES=268435488 \
            -e LOG_METRICS_ADDRESS=127.0.0.1:9599 -e LOKI_ENDPOINT=http://127.0.0.1:3100 \
            -e LOG_AUTH_TOKEN=test-only-bearer-token \
            -v "$PWD/docker/vector/operational.yaml:/etc/vector/operational.yaml:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /tmp:/vector-data-dir \
            ghcr.io/vaheed/cdnfoundry-vector:ci \
            test /etc/vector/operational.yaml
          docker run --rm -e LOKI_RETENTION_PERIOD=168h -e LOKI_MAX_QUERY_LENGTH=168h \
            ghcr.io/vaheed/cdnfoundry-loki:ci -config.file=/etc/loki/loki.yml -config.expand-env=true -verify-config=true
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/docker/prometheus/telemetry-alerts.yml:/etc/prometheus/telemetry-alerts.yml:ro" \
            -v "$PWD/docker/prometheus/dev-metrics-token:/run/secrets/metrics-token:ro" \
            -v "$PWD/docker/prometheus/control-targets.dev.yml:/etc/prometheus/control-targets.yml:ro" \
            -v "$PWD/docker/prometheus/node-targets.dev.yml:/etc/prometheus/node-targets.yml:ro" \
            -v "$PWD/docker/prometheus/dns-targets.dev.yml:/etc/prometheus/dns-targets.yml:ro" \
            -v "$PWD/docker/prometheus/edge-targets.dev.yml:/etc/prometheus/edge-targets.yml:ro" \
            -v "$PWD/docker/prometheus/operational-log-targets.dev.yml:/etc/prometheus/operational-log-targets.yml:ro" \
            ghcr.io/vaheed/cdnfoundry-prometheus:ci \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" ghcr.io/vaheed/cdnfoundry-prometheus:ci \
            test rules /etc/prometheus/alerts.test.yml
      - name: Qualify origin destination safety and IPv6 HTTP/TLS
        run: python3 tests/e2e/origin_destinations.py --image ghcr.io/vaheed/cdnfoundry-edge-runtime:ci
      - name: Qualify compiled DNS services and telemetry outage serving
        run: sudo -E python3 tests/e2e/dns_images.py
      - name: Qualify generated PowerDNS credentials and rotation
        run: sudo -E python3 tests/e2e/fleet_pdns.py
      - name: Qualify patched monitoring scrape and alert APIs
        run: python3 tests/e2e/monitoring_images.py
      - name: Qualify patched PostgreSQL minor upgrade and entrypoint
        run: python3 tests/e2e/postgres_upgrade.py
      - name: Qualify released Vector journal ingestion
        run: python3 tests/e2e/vector_journal.py
      - name: Qualify Vector traffic decoders and redaction
        run: python3 tests/e2e/vector_traffic.py
      - name: Qualify ClickHouse LTS data upgrade and permissions
        run: python3 tests/e2e/clickhouse_upgrade.py
      - name: Qualify patched Caddy with production configs and real TLS
        run: python3 tests/e2e/caddy_ingress.py --image ghcr.io/vaheed/cdnfoundry-caddy:ci
      - name: Qualify uploaded certificate chains with real TLS clients
        run: python3 tests/e2e/uploaded_tls.py --core-image cdnfoundry/core:ci --edge-image ghcr.io/vaheed/cdnfoundry-edge-runtime:ci
      - name: Smoke-test the read-only core image
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --read-only --tmpfs /tmp --tmpfs /app/storage cdnfoundry/core:ci)"
          trap 'docker logs "${container_id}"; docker rm -f "${container_id}" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "${container_id}" php -r "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Qualify generated production observability topology
        run: sudo -E python3 tests/e2e/production_observability.py --release ci

  backend-e2e:
    name: Backend and runtime E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable runner space for source image builds
        run: bash scripts/prepare-image-runner.sh
      - name: Start migratable development control plane
        run: make dev-control-up
      - name: Apply migrations explicitly
        run: make dev-migrate
      - name: Start real development topology
        shell: bash
        run: |
          set +e
          for attempt in 1 2; do
            COMPOSE_PARALLEL_LIMIT=2 make dev-up 2>&1 | tee -a /tmp/cdnfoundry-dev-up.log
            status=${PIPESTATUS[0]}
            if (( status == 0 )); then
              exit 0
            fi
            echo "Development topology startup attempt ${attempt} failed."
          done
          tail -n 80 /tmp/cdnfoundry-dev-up.log > /tmp/cdnfoundry-dev-up-tail.log
          annotation="$(python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' < /tmp/cdnfoundry-dev-up-tail.log)"
          echo "::error title=Development topology startup failed::${annotation}"
          exit "${status}"
      - name: Run Python non-UI E2E
        shell: bash
        run: |
          set +e
          make dev-e2e 2>&1 | tee /tmp/cdnfoundry-e2e.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            tail -n 25 /tmp/cdnfoundry-e2e.log > /tmp/cdnfoundry-e2e-tail.log
            {
              echo '### Non-UI E2E failure tail'
              echo '```text'
              cat /tmp/cdnfoundry-e2e-tail.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            annotation="$(python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' < /tmp/cdnfoundry-e2e-tail.log)"
            echo "::error title=Non-UI E2E failed::${annotation}"
          fi
          exit "${status}"
      - name: Capture service state
        if: always()
        run: docker compose -f compose.dev.yml ps
      - name: Capture failure logs
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail=300
      - name: Stop qualification topology
        if: always()
        run: docker compose -f compose.dev.yml down

  scale-e2e:
    name: Bounded DNS dataset and mutation scale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start bounded control-plane topology
        run: make dev-scale-up
      - name: Apply migrations explicitly
        run: make dev-migrate
      - name: Run bounded scale qualification
        shell: bash
        run: |
          set +e
          make dev-scale-e2e 2>&1 | tee /tmp/cdnfoundry-scale.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            tail -n 25 /tmp/cdnfoundry-scale.log > /tmp/cdnfoundry-scale-tail.log
            {
              echo '### Scale qualification failure tail'
              echo '```text'
              cat /tmp/cdnfoundry-scale-tail.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            annotation="$(python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' < /tmp/cdnfoundry-scale-tail.log)"
            echo "::error title=Scale qualification failed::${annotation}"
          fi
          exit "${status}"
      - name: Capture service state
        if: always()
        run: docker compose -f compose.dev.yml ps
      - name: Capture failure logs
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail=300
      - name: Stop qualification topology
        if: always()
        run: docker compose -f compose.dev.yml down

  go:
    name: Go test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: |
            edge-agent/go.mod
            edge-gateway/go.mod
      - name: Check Go CI failure propagation
        run: python3 -m unittest discover -s tests/qualification -p test_go_ci.py
      - name: Test and build every Go module
        shell: bash
        run: |
          set +e
          {
            set -e -o pipefail
            mapfile -t modules < <(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sort -u)
            if (( ${#modules[@]} == 0 )); then
              echo 'No Go modules are present yet; nothing to test or build.'
              exit 0
            fi
            for module in "${modules[@]}"; do
              echo "Testing ${module}"
              unformatted="$(find "${module}" -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
              test -z "${unformatted}" || { printf 'Unformatted Go files:\n%s\n' "${unformatted}"; exit 1; }
              (cd "${module}" && go vet ./... && go test -v ./... && go build ./...)
            done
          } 2>&1 | tee /tmp/cdnfoundry-go.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            tail -n 40 /tmp/cdnfoundry-go.log > /tmp/cdnfoundry-go-tail.log
            {
              echo '### Go test/build failure tail'
              echo '```text'
              cat /tmp/cdnfoundry-go-tail.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            annotation="$(python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' < /tmp/cdnfoundry-go-tail.log)"
            echo "::error title=Go test/build failed::${annotation}"
          fi
          exit "${status}"

      - name: Qualify origin probes with real DNS, TLS, and IPv6
        run: python3 tests/e2e/origin_probes.py

  docs:
    name: Documentation contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci --prefix docs
      - name: Audit documentation dependencies
        run: npm audit --prefix docs --audit-level=high
      - name: Validate and build documentation
        env:
          DOCS_SITE_URL: https://vaheed.github.io/CDNFoundry
          DOCS_BASE: /CDNFoundry/
        run: make docs-check
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  deploy-docs:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, compose, backend-e2e, scale-e2e, go, docs, production-dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy VitePress to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  production-dependencies:
    name: Scan immutable production dependency images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install policy dependencies
        run: python3 -m pip install -r tests/fleet/requirements.txt
      - name: Scan every production Compose dependency, including role overrides
        run: python3 scripts/supply-chain-policy.py --scan-production-dependencies --output storage/qualification/production-dependencies
      - name: Retain complete dependency scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-dependency-scans
          path: |
            storage/qualification/production-dependencies/*.json
            storage/qualification/production-dependencies/*.txt

  publish-images:
    name: Publish GHCR images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    needs: [core, compose, backend-e2e, scale-e2e, go, docs, production-dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare disposable runner space for source image builds
        run: bash scripts/prepare-image-runner.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize release evidence
        env:
          RELEASE: ${{ github.sha }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          printf 'release=%s\nref=%s\nworkflow_run_id=%s\nstatus=started\n' \
            "${RELEASE}" "${RELEASE_REF_NAME}" "${WORKFLOW_RUN_ID}" \
            > release-evidence/build-context.txt
      - name: Download exact production images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: production-images-*
          path: storage/ci-images
          merge-multiple: true
      - name: Load and verify production image identities
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/ci/images.py load
      - name: Tag qualified images with the source commit
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/ci/images.py tag
      - name: Push, scan, attest, and sign immutable images
        env:
          RELEASE: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          images=(core web edge-control edge-runtime edge-agent edge-gateway mmdb-updater grafana loki postgres vector node-exporter alertmanager prometheus pdns dnsdist caddy)
          aliases=()
          push_with_retry() {
            local image="$1"
            local attempt delay
            for attempt in 1 2 3 4 5; do
              if docker push "${image}"; then
                return 0
              fi
              if (( attempt == 5 )); then
                echo "Image push failed after ${attempt} attempts: ${image}" >&2
                return 1
              fi
              delay=$((30 * (2 ** (attempt - 1))))
              echo "Image push attempt ${attempt} failed; retrying ${image} in ${delay}s." >&2
              sleep "${delay}"
            done
          }
          mkdir -p release-evidence
          database_migration="$(find core/database/migrations -maxdepth 1 -name '*.php' -printf '%f\n' | LC_ALL=C sort | tail -n 1)"
          database_migration="${database_migration%.php}"
          test -n "${database_migration}"
          printf '{"schema_version":1,"release_version":"%s","source_commit":"%s","created_at":"%s","workflow_run_id":"%s","runtime_schema_version":1,"database_migration":"%s","images":[' \
            "${RELEASE_REF_NAME}" "${RELEASE}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${WORKFLOW_RUN_ID}" "${database_migration}" > release-evidence/release-manifest.json
          if [[ "${RELEASE_REF}" == "refs/heads/main" ]]; then
            aliases+=(latest)
          elif [[ "${RELEASE_REF}" == "refs/heads/dev" ]]; then
            aliases+=(dev dev-latest)
          elif [[ "${RELEASE_REF}" == refs/tags/v* ]]; then
            version="${RELEASE_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
              exit 1
            fi

            aliases+=("${RELEASE_REF_NAME}" "${version}")
            if [[ "${version}" != *-* ]]; then
              minor="${version%.*}"
              major="${minor%.*}"
              aliases+=("${minor}" "${major}" latest)
            fi
          fi
          mkdir -p /tmp/cdnfoundry-trivy-cache
          first=true
          for component in "${images[@]}"; do
            image="ghcr.io/vaheed/cdnfoundry-${component}"
            push_with_retry "${image}:${RELEASE}"
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${RELEASE}")"
            test "${digest}" != "${image}:${RELEASE}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}/release-evidence:/out" \
              anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
              "${digest}" -o "spdx-json=/out/${component}.spdx.json"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}:/work:ro" -v "${PWD}/release-evidence:/out" -v /tmp/cdnfoundry-trivy-cache:/root/.cache/ \
              aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --config /work/supply-chain/trivy.yaml --format json --output "/out/${component}.trivy.json" --exit-code 0 "${digest}"
            docker run --rm -v "${PWD}/release-evidence:/out" \
              aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              convert --ignorefile /dev/null --format table --output "/out/${component}.trivy.txt" "/out/${component}.trivy.json"
            docker run --rm -v "${PWD}:/work:ro" -v "${PWD}/release-evidence:/out" -v /tmp/cdnfoundry-trivy-cache:/root/.cache/ \
              aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              convert --ignorefile /work/supply-chain/trivy-classifications.yaml --show-suppressed \
              --format json --output "/out/${component}.classified.json" "/out/${component}.trivy.json"
            docker run --rm -v "${PWD}:/work:ro" -v "${PWD}/release-evidence:/out:ro" \
              aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              convert --exit-code 1 --exit-on-eol 1 --severity HIGH,CRITICAL \
              --ignorefile /work/supply-chain/trivy-classifications.yaml --show-suppressed "/out/${component}.trivy.json"
            jq -n --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --arg commit "${RELEASE}" --arg workflow "${GITHUB_WORKFLOW_REF}" --arg builder "${GITHUB_SERVER_URL}/actions/runner" \
              '{buildDefinition:{buildType:"https://github.com/CDNFoundry/container-release/v1",externalParameters:{source:$source,commit:$commit,workflow:$workflow}},runDetails:{builder:{id:$builder}}}' \
              > "release-evidence/${component}.provenance.json"
            docker run --rm \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -e ACTIONS_ID_TOKEN_REQUEST_URL \
              -e DOCKER_CONFIG=/docker-config \
              -v "${HOME}/.docker/config.json:/docker-config/config.json:ro" \
              -v "${PWD}/release-evidence:/evidence:ro" \
              gcr.io/projectsigstore/cosign:v3.0.2@sha256:b29487e48205d875c324c79583e2806d9d269c0fa299e0861bbec023d8430c8b \
              sign --yes "${digest}"

            docker run --rm \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -e ACTIONS_ID_TOKEN_REQUEST_URL \
              -e DOCKER_CONFIG=/docker-config \
              -v "${HOME}/.docker/config.json:/docker-config/config.json:ro" \
              -v "${PWD}/release-evidence:/evidence:ro" \
              gcr.io/projectsigstore/cosign:v3.0.2@sha256:b29487e48205d875c324c79583e2806d9d269c0fa299e0861bbec023d8430c8b \
              attest --yes \
              --type spdxjson \
              --predicate "/evidence/${component}.spdx.json" \
              "${digest}"

            docker run --rm \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -e ACTIONS_ID_TOKEN_REQUEST_URL \
              -e DOCKER_CONFIG=/docker-config \
              -v "${HOME}/.docker/config.json:/docker-config/config.json:ro" \
              -v "${PWD}/release-evidence:/evidence:ro" \
              gcr.io/projectsigstore/cosign:v3.0.2@sha256:b29487e48205d875c324c79583e2806d9d269c0fa299e0861bbec023d8430c8b \
              attest --yes \
              --type slsaprovenance1 \
              --predicate "/evidence/${component}.provenance.json" \
              "${digest}"
            ${first} || printf ',' >> release-evidence/release-manifest.json
            first=false
            jq -n --arg component "${component}" --arg image "${digest}" \
              '{component:$component,image:$image,sbom:"oci-attestation:spdxjson",signature:"sigstore-keyless",provenance:"oci-attestation:slsaprovenance1",vulnerability_scan:"passed-high-critical-policy"}' \
              >> release-evidence/release-manifest.json
          done
          printf ']}' >> release-evidence/release-manifest.json
          jq empty release-evidence/release-manifest.json
          docker run --rm --user 0:0 -e ACTIONS_ID_TOKEN_REQUEST_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL -v "${PWD}/release-evidence:/evidence" \
            gcr.io/projectsigstore/cosign:v3.0.2@sha256:b29487e48205d875c324c79583e2806d9d269c0fa299e0861bbec023d8430c8b \
            sign-blob --yes --bundle /evidence/release-manifest.sigstore.json /evidence/release-manifest.json
          for component in "${images[@]}"; do
            image="ghcr.io/vaheed/cdnfoundry-${component}"
            for alias in "${aliases[@]}"; do
              docker tag "${image}:${RELEASE}" "${image}:${alias}"
              push_with_retry "${image}:${alias}"
            done
          done
      - name: Normalize release evidence permissions
        if: always()
        run: |
          if [[ -d release-evidence ]]; then
            sudo chown -R "$(id -u):$(id -g)" release-evidence
            chmod -R u+rwX,go+rX release-evidence
          fi
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
