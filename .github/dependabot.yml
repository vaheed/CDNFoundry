version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: docker
    directories:
      - /core
      - /edge-agent
      - /edge-gateway
      - /docker/openresty
      - /docker/nginx
      - /docker/mmdb-updater
      - /docker/grafana
      - /docker/loki
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: composer
    directory: /core
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: npm
    directories:
      - /core
      - /docs
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: gomod
    directories:
      - /edge-agent
      - /edge-gateway
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
  # Image references in the Compose files, which Dependabot reads as its own ecosystem.
  - package-ecosystem: docker-compose
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
