# Used only by tests/browser/run.sh. A disposable sqlite database on tmpfs: it never touches the development
# PostgreSQL or any named volume, and disappears when the container stops.
services:
  browser-app:
    extends:
      file: compose.dev.yml
      service: core
    container_name: cdnfoundry-browser-app
    restart: "no"
    depends_on: !reset {}
    healthcheck: !reset {}
    networks: !override [default]
    ports: !override ["127.0.0.1:18080:8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:18080
      APP_CONFIG_CACHE: /tmp/cdnfoundry-browser-config.php
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/browser.sqlite
      DB_URL: ""
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: "null"
      LOG_CHANNEL: stderr
      CLICKHOUSE_URL: http://127.0.0.1:1
      PROMETHEUS_URL: http://127.0.0.1:1
      PHP_CLI_SERVER_WORKERS: "4"
      CDNF_BROWSER_ADMIN_PASSWORD: ${CDNF_BROWSER_ADMIN_PASSWORD:?generated by tests/browser/run.sh}
      CDNF_BROWSER_USER_PASSWORD: ${CDNF_BROWSER_USER_PASSWORD:?generated by tests/browser/run.sh}
    volumes: !override
      - ./core:/app
      - ./tests:/tests:ro
      - core-vendor:/app/vendor:ro
    tmpfs:
      - /tmp:rw,nosuid,size=128m,mode=1777
      - /app/storage:rw,nosuid,size=128m,mode=1777
      - /app/bootstrap/cache:rw,nosuid,size=16m,mode=1777
    mem_limit: 1g
    pids_limit: 256
    entrypoint: []
    command:
      - sh
      - -ec
      - |
        mkdir -p /app/storage/framework/views /app/storage/framework/cache /app/storage/framework/sessions /app/storage/logs
        php artisan migrate --force --no-interaction
        php artisan tinker --execute="require '/tests/browser/seed.php';"
        exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload
